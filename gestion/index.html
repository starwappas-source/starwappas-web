function makeSlots(start,end){
  const s=[];
  for(let h=start;h<end;h++){
    s.push(`${String(h).padStart(2,"0")}:00`);
    s.push(`${String(h).padStart(2,"0")}:15`);
    s.push(`${String(h).padStart(2,"0")}:30`);
    s.push(`${String(h).padStart(2,"0")}:45`);
  }
  s.push(`${String(end).padStart(2,"0")}:00`);
  return s;
}
const SLOTS_WEEK = makeSlots(9,21);
const SLOTS_SAT  = makeSlots(9,14);

function today(){ return new Date().toISOString().split("T")[0]; }
function isSat(d){ return new Date(d+"T12:00:00").getDay()===6; }
function isSun(d){ return new Date(d+"T12:00:00").getDay()===0; }
function fmt(d){ if(!d)return""; const[y,m,dd]=d.split("-"); return`${dd}/${m}/${y}`; }
function fmtM(n){ return Number(n||0).toLocaleString("es-ES",{style:"currency",currency:"EUR"}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }

// Normaliza teléfono para WhatsApp: elimina prefijo +34/0034 si ya existe, devuelve 9 dígitos
function normTel(raw){
  let t=(raw||"").replace(/\s/g,"").replace(/^\+/,"").replace(/\D/g,"");
  if(t.startsWith("0034")) t=t.slice(4);
  if(t.startsWith("34")&&t.length===11) t=t.slice(2);
  return t; // 9 dígitos limpios
}

// Storage usando localStorage como fallback (Netlify no tiene window.storage del artifact)
async function save(key,val){
  try{
    if(window.storage) await window.storage.set(key,JSON.stringify(val));
    else localStorage.setItem(key,JSON.stringify(val));
  }catch(e){ try{localStorage.setItem(key,JSON.stringify(val));}catch(e2){} }
}
async function load(key,def){
  try{
    if(window.storage){ const r=await window.storage.get(key); return r?JSON.parse(r.value):def; }
    else{ const r=localStorage.getItem(key); return r?JSON.parse(r):def; }
  }catch(e){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):def; }catch(e2){ return def; } }
}

// ─── LOGIN ───────────────────────────────────────────────────────────────────
function Login({onLogin,usuarios,passes}){
  const listaUsuarios=usuarios&&usuarios.length>0?usuarios:USERS;
  const [user,setUser]=useState("");
  const [pass,setPass]=useState("");
  const [error,setError]=useState("");
  const [showPass,setShowPass]=useState(false);

  function getPassEfectiva(u){
    // Contraseña en personal tiene prioridad, luego passes map, luego default
    if(u.pass) return u.pass;
    return (passes&&passes[u.id])||u.pass||"";
  }

  function intentar(){
    const loginId=user.toLowerCase().replace(/\s/g,"");
    const u=listaUsuarios.find(x=>(x.loginId||x.id)===loginId&&getPassEfectiva(x)===pass);
    if(u){ setError(""); onLogin({...u,id:u.loginId||u.id}); }
    else setError("Usuario o contraseña incorrectos");
  }

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#3a1a2e 0%,#6a2a4e 50%,#3a1a2e 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
      <div style={{background:"white",borderRadius:"24px",padding:"44px 40px",width:"100%",maxWidth:"400px",boxShadow:"0 32px 80px rgba(0,0,0,0.3)"}}>
        <div style={{textAlign:"center",marginBottom:"32px"}}>
          <div style={{fontSize:"2.5rem",marginBottom:"12px"}}>✨</div>
          <h1 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.8rem",color:"#3a1a2e",fontWeight:700}}>Star Wappas</h1>
          <p style={{color:"#9a6a8a",fontSize:"0.85rem",marginTop:"6px"}}>Sistema de gestión interna</p>
        </div>
        <div style={{marginBottom:"16px"}}>
          <Field label="Usuario">
            <select value={user} onChange={e=>setUser(e.target.value)} style={inp}>
              <option value="">Selecciona tu nombre...</option>
              {listaUsuarios.map(u=><option key={u.loginId||u.id} value={u.loginId||u.id}>{u.nombre}</option>)}
            </select>
          </Field>
          <Field label="Contraseña">
            <div style={{position:"relative"}}>
              <input
                type={showPass?"text":"password"}
                value={pass}
                onChange={e=>setPass(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&intentar()}
                style={{...inp,paddingRight:"44px"}}
                placeholder="••••••••"
              />
              <button onClick={()=>setShowPass(!showPass)} style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"#9a6a8a",fontSize:"1rem"}}>{showPass?"🙈":"👁"}</button>
            </div>
          </Field>
        </div>
        {error&&<div style={{background:"#ffe0e0",borderRadius:"8px",padding:"10px 14px",fontSize:"0.83rem",color:"#c03030",marginBottom:"14px",textAlign:"center"}}>{error}</div>}
        <button onClick={intentar} style={{...btn(),width:"100%",padding:"13px",fontSize:"1rem",borderRadius:"12px"}}>Entrar →</button>
        <p style={{textAlign:"center",fontSize:"0.75rem",color:"#ccc",marginTop:"20px"}}>Acceso restringido al personal autorizado</p>
      </div>
    </div>
  );
}

// ─── BUSCADOR CON AUTOCOMPLETADO ─────────────────────────────────────────────
function Autocomplete({value,onChange,opciones,placeholder,renderOpcion,getLabel,onCrearNuevo,labelCrear}){
  const [texto,setTexto]=useState("");
  const [abierto,setAbierto]=useState(false);
  const [seleccionado,setSeleccionado]=useState(null);
  const ref=useRef();

  useEffect(()=>{
    // Si hay valor, mostrar el label
    if(value){const op=opciones.find(o=>o.id===value);if(op){setTexto(getLabel(op));setSeleccionado(op);}}
    else{setTexto("");setSeleccionado(null);}
  },[value]);

  useEffect(()=>{
    function click(e){if(ref.current&&!ref.current.contains(e.target))setAbierto(false);}
    document.addEventListener("mousedown",click);
    return()=>document.removeEventListener("mousedown",click);
  },[]);

  const filtradas=texto.length>0
    ? opciones.filter(o=>getLabel(o).toLowerCase().includes(texto.toLowerCase())).slice(0,12)
    : [];

  function seleccionar(op){
    setTexto(getLabel(op));
    setSeleccionado(op);
    onChange(op.id);
    setAbierto(false);
  }
  function limpiar(){
    setTexto(""); setSeleccionado(null); onChange(""); setAbierto(false);
  }

  return(
    <div ref={ref} style={{position:"relative"}}>
      <div style={{position:"relative"}}>
        <input
          value={texto}
          onChange={e=>{setTexto(e.target.value);setAbierto(true);if(!e.target.value){onChange("");setSeleccionado(null);}}}
          onFocus={()=>{if(texto)setAbierto(true);}}
          placeholder={placeholder}
          style={{...inp,paddingRight:"30px"}}
          autoComplete="off"
        />
        {texto&&<button onClick={limpiar} style={{position:"absolute",right:"8px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"#bbb",fontSize:"1rem",lineHeight:1}}>×</button>}
      </div>
      {abierto&&(filtradas.length>0||onCrearNuevo)&&(
        <div style={{position:"absolute",top:"calc(100% + 3px)",left:0,right:0,background:"white",border:"1.5px solid #e8d5e0",borderRadius:"9px",boxShadow:"0 8px 24px rgba(0,0,0,0.12)",zIndex:999,maxHeight:"220px",overflowY:"auto"}}>
          {filtradas.map(op=>(
            <div key={op.id} onMouseDown={()=>seleccionar(op)}
              style={{padding:"8px 12px",cursor:"pointer",fontSize:"0.86rem",borderBottom:"1px solid #fdf0f5"}}
              onMouseEnter={e=>e.currentTarget.style.background="#fdf0f5"}
              onMouseLeave={e=>e.currentTarget.style.background="white"}>
              {renderOpcion?renderOpcion(op):getLabel(op)}
            </div>
          ))}
          {onCrearNuevo&&texto.length>1&&(
            <div onMouseDown={()=>{onCrearNuevo(texto);setAbierto(false);}}
              style={{padding:"9px 12px",cursor:"pointer",fontSize:"0.84rem",color:"#c9527a",fontWeight:600,background:"#fdf8fb",borderTop:"1px solid #f0e0ea"}}>
              ＋ Crear nueva clienta "{texto}"
            </div>
          )}
          {filtradas.length===0&&!onCrearNuevo&&(
            <div style={{padding:"10px 12px",fontSize:"0.83rem",color:"#bbb"}}>Sin resultados</div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── AGENDA ──────────────────────────────────────────────────────────────────
function Agenda({citas,clientes,servicios,bonos,onAdd,onEdit,onDelete,onAddCliente,onEditBono,onAddIngreso,usuario}){
  const [fecha,setFecha]=useState(today());
  const [vistaMode,setVistaMode]=useState("dia");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [modalNuevaClientа,setModalNuevaCliente]=useState(null);
  const [formNuevaCliente,setFormNuevaCliente]=useState({});
  const [dragging,setDragging]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [bloqueoArrastrando,setBloqueoArrastrando]=useState(false);
  const [bloqueoHoraIni,setBloqueoHoraIni]=useState(null);
  const [bloqueoHoraFin,setBloqueoHoraFin]=useState(null);
  const [modalBloqueo,setModalBloqueo]=useState(null);
  const [formBloqueo,setFormBloqueo]=useState({tipo:"Bloqueado",nota:"",cabinas:[]});
  const [bloqueos,setBloqueos]=useState(()=>{try{const d=localStorage.getItem("v3_bloqueos");return d?JSON.parse(d):[];}catch(e){return [];}});

  useEffect(()=>{
    const up=()=>{
      if(bloqueoArrastrando){
        if(bloqueoHoraIni&&bloqueoHoraFin&&bloqueoHoraIni!==bloqueoHoraFin){
          setModalBloqueo({horaIni:bloqueoHoraIni,horaFin:bloqueoHoraFin,cab:bloqueoArrastrando});
          setFormBloqueo({tipo:"Bloqueado",nota:""});
        }
        setBloqueoArrastrando(false);
      }
    };
    window.addEventListener("mouseup",up);
    return()=>window.removeEventListener("mouseup",up);
  },[bloqueoArrastrando,bloqueoHoraIni,bloqueoHoraFin]);

  const esAdmin=usuario.rol==="admin";
  const esRestringido=usuario.rol==="restringido";
  const esSab=isSat(fecha), esDom=isSun(fecha);
  const SLOTS=esSab?SLOTS_SAT:SLOTS_WEEK;

  const citasDia=citas.filter(c=>{
    if(c.fecha!==fecha) return false;
    if(esRestringido) return c.empleada===usuario.nombre;
    return true;
  });

  function openNew(hora="10:00",cabina=CABINAS[0],empleada=STAFF[0]){
    const emp=esRestringido?usuario.nombre:empleada;
    setForm({id:null,fecha,hora,duracion:"60",cabina:esRestringido?CABINAS[STAFF.indexOf(usuario.nombre)]:cabina,empleada:emp,clienteId:"",serviciosIds:[],svBusq:"",notas:"",cobrado:false,terminado:false,metodoPago:"Tarjeta",bonoId:""});
    setModal("form");
  }
  function openEdit(c){
    if(esRestringido&&c.empleada!==usuario.nombre) return;
    setForm({...c,serviciosIds:c.serviciosIds||[],svBusq:""});
    setModal("form");
  }
  function guardar(){
    if(!form.clienteId||!form.hora) return;
    const esBono=(form.metodoPago==="Bono"||form.metodoPago==="Pack")&&form.bonoId;
    const total=esBono?0:(form.serviciosIds||[]).reduce((s,id)=>s+Number(servicios.find(x=>x.id===id)?.precio||0),0);
    const duracionSvs=(form.serviciosIds||[]).reduce((s,id)=>s+Number(servicios.find(x=>x.id===id)?.duracion||0),0);
    const duracionFinal=duracionSvs>0?String(duracionSvs):form.duracion||"60";
    // Con bono: cobrado=true pero importe=0, no genera ingreso en caja
    const data={...form,total,duracion:duracionFinal,cobrado:esBono?true:form.cobrado};
    const citaOriginal=citas.find(c=>c.id===form.id);
    const yaCobrada=citaOriginal?.cobrado;
    const yaEraBono=citaOriginal?.metodoPago==="Bono";

    if(!form.id){
      onAdd({...data,id:uid()});
      // Registrar en Caja solo si es cobro real (no bono)
      if(data.cobrado&&total>0&&!esBono){
        onAddIngreso({id:uid(),fecha:data.fecha,importe:total,metodoPago:data.metodoPago||"Efectivo",clienteId:data.clienteId,empleada:data.empleada,concepto:"Cita agenda"});
      }
      // Descontar sesión del bono
      if(esBono){
        const b=bonos.find(x=>x.id===form.bonoId);
        if(b){
          const historial=[...(b.historialUsos||[]),{fecha:data.fecha}];
          onEditBono({...b,sesionesUsadas:Number(b.sesionesUsadas||0)+1,historialUsos:historial});
        }
      }
    } else {
      onEdit(data);
      // Si acaba de marcarse cobrada y no es bono, registrar en Caja
      if(data.cobrado&&!yaCobrada&&total>0&&!esBono){
        onAddIngreso({id:uid(),fecha:data.fecha,importe:total,metodoPago:data.metodoPago||"Efectivo",clienteId:data.clienteId,empleada:data.empleada,concepto:"Cita agenda"});
      }
      // Si ahora usa bono y antes no (o usaba otro bono), descontar sesión
      if(esBono&&(!(citaOriginal?.metodoPago==="Bono"||citaOriginal?.metodoPago==="Pack")||citaOriginal?.bonoId!==form.bonoId)){
        const b=bonos.find(x=>x.id===form.bonoId);
        if(b){
          const historial=[...(b.historialUsos||[]),{fecha:data.fecha}];
          onEditBono({...b,sesionesUsadas:Number(b.sesionesUsadas||0)+1,historialUsos:historial});
        }
      }
    }
    setModal(null);
  }

  function saveBloqueos(bl){setBloqueos(bl);try{localStorage.setItem("v3_bloqueos",JSON.stringify(bl));}catch(e){}}
  function guardarBloqueo(){
    if(!modalBloqueo) return;
    const nuevo={id:uid(),fecha,horaIni:modalBloqueo.horaIni,horaFin:modalBloqueo.horaFin,cab:modalBloqueo.cab,tipo:formBloqueo.tipo,nota:formBloqueo.nota};
    saveBloqueos([...bloqueos,nuevo]);
    setModalBloqueo(null);setBloqueoArrastrando(false);setBloqueoHoraIni(null);setBloqueoHoraFin(null);
  }
  function borrarBloqueo(id){saveBloqueos(bloqueos.filter(b=>b.id!==id));}
  function bloquearDiaEntero(){
    const slots=isSat(fecha)?SLOTS_SAT:SLOTS_WEEK;
    setModalBloqueo({horaIni:slots[0],horaFin:slots[slots.length-1]});
    setFormBloqueo({tipo:"Bloqueado",nota:"",cabinas:[...CABINAS]});
  }

  function crearClienteRapido(nombreTexto){
    const [nombre,...resto]=nombreTexto.trim().split(" ");
    setFormNuevaCliente({nombre:nombreTexto.trim(),telefono:"",email:"",fechaNac:"",dni:"",direccion:"",alergias:"",tipoPiel:"",origen:"",observaciones:""});
    setModalNuevaCliente(true);
  }
  function guardarNuevaCliente(){
    if(!formNuevaCliente.nombre) return;
    const nueva={...formNuevaCliente,id:uid()};
    onAddCliente(nueva);
    setForm(f=>({...f,clienteId:nueva.id}));
    setModalNuevaCliente(false);
  }

  function handleDrop(hora,cab){
    if(!dragging) return;
    const cita=citas.find(c=>c.id===dragging);
    if(!cita) return;
    const staffIdx=cabinasVer.indexOf(cab);
    const nuevaEmpleada=esRestringido?usuario.nombre:(STAFF[CABINAS.indexOf(cab)]||cita.empleada);
    onEdit({...cita,hora,cabina:cab,empleada:nuevaEmpleada});
    setDragging(null);setDragOver(null);
  }

  const prev=()=>{const d=new Date(fecha+"T12:00:00");d.setDate(d.getDate()-1);setFecha(d.toISOString().split("T")[0]);};
  const next=()=>{const d=new Date(fecha+"T12:00:00");d.setDate(d.getDate()+1);setFecha(d.toISOString().split("T")[0]);};

  // Build grid with rowspan for duration
  // For each cita, mark how many slots it occupies
  const slotMin=15;
  // grid[hora][cab] = {cita, esInicio, span} o null
  const grid={};
  SLOTS.forEach(h=>{grid[h]={};CABINAS.forEach(c=>{grid[h][c]={tipo:"libre"};});});
  // slots ocupados (no inicio) para no renderizar
  const ocupados={};
  citasDia.forEach(cita=>{
    const dur=Number(cita.duracion||60);
    const slots=Math.max(1,Math.round(dur/slotMin));
    const idx=SLOTS.indexOf(cita.hora);
    if(idx<0) return;
    for(let i=0;i<slots;i++){
      const h=SLOTS[idx+i];
      if(!h) break;
      if(i===0){
        grid[h][cita.cabina]={tipo:"inicio",cita,span:slots};
      } else {
        grid[h][cita.cabina]={tipo:"ocupado"};
      }
    }
  });

  // Marcar bloqueos en grid
  const bloqueosDia=bloqueos.filter(b=>b.fecha===fecha);
  bloqueosDia.forEach(bl=>{
    const iIni=SLOTS.indexOf(bl.horaIni);
    const iFin=SLOTS.indexOf(bl.horaFin);
    if(iIni<0) return;
    const end=iFin>iIni?iFin:SLOTS.length-1;
    const span=end-iIni+1;
    for(let i=iIni;i<=end;i++){
      const h=SLOTS[i];
      if(!grid[h]) continue;
      if(!grid[h][bl.cab]||grid[h][bl.cab].tipo==="libre"){
        if(i===iIni) grid[h][bl.cab]={tipo:"bloqueo_inicio",bloqueo:bl,span};
        else grid[h][bl.cab]={tipo:"bloqueo_ocupado"};
      }
    }
  });
  const totalDia=citasDia.filter(c=>c.cobrado).reduce((s,c)=>s+Number(c.total||0),0);
  const cabinasVer=esRestringido?CABINAS.filter((_,i)=>STAFF[i]===usuario.nombre):CABINAS;

  // Preview solo en la columna que se está arrastrando
  if(bloqueoArrastrando&&bloqueoHoraIni&&bloqueoHoraFin){
    const iIni=SLOTS.indexOf(bloqueoHoraIni);
    const iFin=SLOTS.indexOf(bloqueoHoraFin);
    const end=iFin>=iIni?iFin:iIni;
    for(let i=iIni;i<=end;i++){
      const h=SLOTS[i];
      if(h&&grid[h]&&grid[h][bloqueoArrastrando]?.tipo==="libre"){
        grid[h][bloqueoArrastrando]={tipo:"bloqueo_preview"};
      }
    }
  }

  // Servicios filtrados por búsqueda en el form
  const svsFiltrados=servicios.filter(sv=>
    !form.svBusq||(sv.nombre||"").toLowerCase().includes((form.svBusq||"").toLowerCase())||(sv.categoria||"").toLowerCase().includes((form.svBusq||"").toLowerCase())
  );

  // Semana: lunes–sábado de la semana que contiene `fecha`
  const semanaFechas=(()=>{
    const d=new Date(fecha+"T12:00:00");
    const dow=d.getDay();
    const lun=new Date(d);lun.setDate(d.getDate()-(dow===0?6:dow-1));
    return Array.from({length:6},(_,i)=>{const f=new Date(lun);f.setDate(lun.getDate()+i);return f.toISOString().split("T")[0];});
  })();

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px",flexWrap:"wrap"}}>
        <div style={{display:"flex",background:"#f0e0ea",borderRadius:"8px",overflow:"hidden"}}>
          <button onClick={()=>setVistaMode("dia")} style={{...btn(vistaMode==="dia"?"#c9527a":"#f0e0ea",vistaMode==="dia"?"#fff":"#9a6a8a"),borderRadius:0,padding:"6px 12px",fontSize:"0.78rem"}}>📅 Día</button>
          <button onClick={()=>setVistaMode("semana")} style={{...btn(vistaMode==="semana"?"#c9527a":"#f0e0ea",vistaMode==="semana"?"#fff":"#9a6a8a"),borderRadius:0,padding:"6px 12px",fontSize:"0.78rem"}}>📆 Semana</button>
        </div>
        <button onClick={prev} style={btn("#f0e0ea","#3a1a2e")}>◀</button>
        <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} style={{...inp,width:"150px"}}/>
        <button onClick={next} style={btn("#f0e0ea","#3a1a2e")}>▶</button>
        <button onClick={()=>setFecha(today())} style={btn("#f0e0ea","#3a1a2e")}>Hoy</button>
        <span style={{color:"#9a6a8a",fontSize:"0.85rem",fontWeight:500,flex:1}}>
          {vistaMode==="semana"
            ?`Semana del ${fmt(semanaFechas[0])} al ${fmt(semanaFechas[5])}`
            :(new Date(fecha+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))}
          {vistaMode==="dia"&&esSab&&<span style={{background:"#e8f0ff",color:"#2a4a9a",borderRadius:"6px",padding:"2px 8px",fontSize:"0.73rem",marginLeft:"8px"}}>Sábado · 9:00–14:00</span>}
          {vistaMode==="dia"&&esDom&&<span style={{background:"#ffe8e8",color:"#9a2a2a",borderRadius:"6px",padding:"2px 8px",fontSize:"0.73rem",marginLeft:"8px"}}>Cerrado</span>}
        </span>
        {vistaMode==="dia"&&esAdmin&&totalDia>0&&<span style={{background:"#d4f0e0",color:"#2a7a4a",borderRadius:"8px",padding:"4px 11px",fontSize:"0.8rem",fontWeight:700}}>Cobrado: {fmtM(totalDia)}</span>}
        <button onClick={()=>{if(vistaMode==="semana"){setVistaMode("dia");}openNew();}} style={btn()} disabled={vistaMode==="dia"&&esDom}>+ Nueva cita</button>
        {vistaMode==="dia"&&esAdmin&&<>
          <button onClick={bloquearDiaEntero} style={{...btn("#9a9a9a"),padding:"5px 11px",fontSize:"0.76rem"}}>🔒 Bloquear día</button>
          <span style={{fontSize:"0.7rem",color:"#bbb"}}>· Arrastrar = bloquear tramo</span>
        </>}
      </div>

      {!esRestringido&&(
        <div style={{display:"flex",gap:"7px",flexWrap:"wrap",marginBottom:"12px",alignItems:"center"}}>
          {STAFF.map((s,i)=>(
            <span key={s} style={{background:COLORS_STAFF[i],color:"#fff",borderRadius:"20px",padding:"3px 11px",fontSize:"0.76rem",fontWeight:600}}>{s}</span>
          ))}
          <span style={{fontSize:"0.72rem",color:"#9a6a8a",marginLeft:"8px"}}>· Color suave = terminado · Color pleno = cobrado</span>
        </div>
      )}

      {vistaMode==="semana"&&(
        <div style={{overflowX:"auto"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:"6px",minWidth:"700px"}}>
            {semanaFechas.map(f=>{
              const esDomF=isSun(f),esSabF=isSat(f),isToday=f===today(),isSel=f===fecha;
              const citasF=citas.filter(c=>c.fecha===f&&(!esRestringido||c.empleada===usuario.nombre)).sort((a,b)=>a.hora.localeCompare(b.hora));
              const totalF=citasF.filter(c=>c.cobrado).reduce((s,c)=>s+Number(c.total||0),0);
              const nomDia=new Date(f+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric"});
              return(
                <div key={f} style={{background:isSel?"#f5e0f0":esDomF?"#f8f8f8":"white",borderRadius:"9px",border:isSel?"2px solid #c9527a":isToday?"2px solid #f0c0e0":"1px solid #f0e0ea",overflow:"hidden",cursor:"pointer",minHeight:"120px"}}
                  onClick={()=>{setFecha(f);if(!esDomF)setVistaMode("dia");}}>
                  <div style={{padding:"6px 8px",background:isSel?"#c9527a":isToday?"#f5e0f0":"#fdf0f5",borderBottom:"1px solid #f0e0ea"}}>
                    <div style={{fontWeight:700,color:isSel?"white":esDomF?"#ccc":"#3a1a2e",fontSize:"0.77rem",textTransform:"capitalize"}}>{nomDia}</div>
                    {esSabF&&<div style={{fontSize:"0.63rem",color:isSel?"rgba(255,255,255,0.7)":"#9a6a8a"}}>9–14h</div>}
                    {esDomF&&<div style={{fontSize:"0.63rem",color:"#ccc"}}>Cerrado</div>}
                  </div>
                  <div style={{padding:"4px 6px"}}>
                    {citasF.slice(0,5).map(c=>{
                      const cl=clientes.find(x=>x.id===c.clienteId);
                      const si=STAFF.indexOf(c.empleada);
                      const col=si>=0?COLORS_STAFF[si]:"#c9527a";
                      return(
                        <div key={c.id} style={{background:col+"22",borderLeft:`3px solid ${col}`,borderRadius:"4px",padding:"2px 5px",marginBottom:"3px",fontSize:"0.67rem",cursor:"pointer"}}
                          onClick={e=>{e.stopPropagation();setFecha(f);setVistaMode("dia");openEdit(c);}}>
                          <span style={{fontWeight:700,color:col}}>{c.hora}</span>
                          <span style={{color:"#3a1a2e",marginLeft:"3px"}}>{cl?.nombre?.split(" ")[0]||"?"}</span>
                          {c.cobrado&&<span style={{color:"#2a7a4a",marginLeft:"2px",fontSize:"0.58rem"}}>✓</span>}
                        </div>
                      );
                    })}
                    {citasF.length>5&&<div style={{fontSize:"0.63rem",color:"#9a6a8a",textAlign:"center",marginTop:"2px"}}>+{citasF.length-5} más</div>}
                    {citasF.length===0&&!esDomF&&<div style={{fontSize:"0.65rem",color:"#e0d0e0",textAlign:"center",padding:"10px 0"}}>Libre</div>}
                    {totalF>0&&<div style={{fontSize:"0.65rem",color:"#2a7a4a",textAlign:"right",marginTop:"3px",fontWeight:700}}>{fmtM(totalF)}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {vistaMode==="dia"&&esDom?(
        <div style={{textAlign:"center",padding:"50px",color:"#ccc"}}>🌿 Star Wappas cerrado los domingos</div>
      ):vistaMode==="dia"&&(
        <div style={{overflowX:"auto"}} onMouseUp={()=>{if(bloqueoArrastrando&&bloqueoHoraIni&&bloqueoHoraFin&&bloqueoHoraIni!==bloqueoHoraFin){setModalBloqueo({horaIni:bloqueoHoraIni,horaFin:bloqueoHoraFin,cab:bloqueoArrastrando});setFormBloqueo({tipo:"Bloqueado",nota:""});}else if(bloqueoArrastrando){setBloqueoArrastrando(false);setBloqueoHoraIni(null);setBloqueoHoraFin(null);}}}
  onMouseLeave={()=>{if(bloqueoArrastrando){setBloqueoArrastrando(false);setBloqueoHoraIni(null);setBloqueoHoraFin(null);}}}>
          <table style={{borderCollapse:"collapse",width:"100%",minWidth:esRestringido?"300px":"780px",userSelect:"none"}}>
            <thead>
              <tr>
                <th style={{width:"54px",padding:"5px 4px",background:"#fdf0f5",color:"#9a6a8a",fontSize:"0.7rem",fontWeight:700,border:"1px solid #f0e0ea",textAlign:"center"}}>Hora</th>
                {cabinasVer.map((c,ci)=>{
                  const staffIdx=esRestringido?STAFF.indexOf(usuario.nombre):ci;
                  return(
                    <th key={c} style={{padding:"5px",background:"#fdf0f5",fontSize:"0.73rem",fontWeight:700,border:"1px solid #f0e0ea",minWidth:"130px",textAlign:"center"}}>
                      <div style={{color:"#3a1a2e"}}>{c}</div>
                      <div style={{color:COLORS_STAFF[staffIdx]||"#c9527a",fontSize:"0.68rem",marginTop:"1px"}}>{STAFF[staffIdx]||""}</div>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {SLOTS.map(hora=>(
                <tr key={hora}>
                  <td style={{padding:"1px 5px",fontSize:hora.endsWith(":00")?"0.68rem":hora.endsWith(":30")?"0.59rem":"0.55rem",color:hora.endsWith(":00")?"#7a3a5a":hora.endsWith(":30")?"#bbb":"#e0e0e0",background:"#fdf8fb",border:"1px solid #f0e0ea",textAlign:"center",fontWeight:hora.endsWith(":00")?"700":"400",lineHeight:"14px",whiteSpace:"nowrap"}}>{hora}</td>
                  {cabinasVer.map((cab,ci)=>{
                    const staffIdx=esRestringido?STAFF.indexOf(usuario.nombre):ci;
                    const celda=grid[hora]?.[cab];
                    if(!celda||celda.tipo==="ocupado") return null;
                    if(celda.tipo==="bloqueo_ocupado") return(
                      <td key={cab} style={{border:"1px solid #f0e0ea",height:"14px"}}
                        onMouseEnter={()=>{if(bloqueoArrastrando===cab&&bloqueoHoraIni){const iS=SLOTS.indexOf(bloqueoHoraIni);const iC=SLOTS.indexOf(hora);setBloqueoHoraFin(SLOTS[Math.max(iS,iC)]);}}}
                        onMouseUp={()=>{if(bloqueoArrastrando===cab&&bloqueoHoraIni&&bloqueoHoraIni!==hora){setModalBloqueo({horaIni:bloqueoHoraIni,horaFin:bloqueoHoraFin||hora,cab});setFormBloqueo({tipo:"Bloqueado",nota:""});setBloqueoArrastrando(false);}}}
                      />
                    );
                    if(celda.tipo==="inicio"){
                      const {cita,span}=celda;
                      const si=STAFF.indexOf(cita.empleada);
                      const colorBase=si>=0?COLORS_STAFF[si]:"#c9527a";
                      const color=cita.cobrado?colorBase:cita.terminado?colorBase+"55":colorBase;
                      const textColor=cita.terminado&&!cita.cobrado?"#3a1a2e":"#fff";
                      const cl=clientes.find(c=>c.id===cita.clienteId);
                      const rowH=span*14;
                      return(
                        <td key={cab} rowSpan={span} style={{border:"1px solid #f0e0ea",padding:"3px",verticalAlign:"top",cursor:"grab",background:"white",height:`${rowH}px`,opacity:dragging===cita.id?0.5:1}}
                          draggable
                          onDragStart={()=>setDragging(cita.id)}
                          onDragEnd={()=>{setDragging(null);setDragOver(null);}}
                          onClick={()=>openEdit(cita)}>
                          <div style={{background:color,borderRadius:"5px",padding:"4px 7px",height:"100%",fontSize:"0.72rem",color:textColor,fontWeight:600,overflow:"hidden",display:"flex",flexDirection:"column",gap:"2px",minHeight:`${rowH-4}px`,border:cita.terminado&&!cita.cobrado?`1.5px solid ${colorBase}`:"none"}}>
                            <div style={{display:"flex",alignItems:"center",gap:"3px"}}>
                              {cita.cobrado&&<span style={{fontSize:"0.6rem",opacity:0.9}}>✓</span>}
                              <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cl?.nombre?.split(" ")[0]||"?"} {cl?.nombre?.split(" ")[1]||""}</span>
                            </div>
                            {(cita.serviciosIds||[]).slice(0,span>1?3:1).map(id=>{
                              const sv=servicios.find(s=>s.id===id);
                              return sv?<div key={id} style={{fontSize:"0.65rem",opacity:0.85,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>· {sv.nombre}</div>:null;
                            })}
                            {span>1&&<div style={{fontSize:"0.63rem",opacity:0.7,marginTop:"auto"}}>{cita.duracion} min</div>}
                          </div>
                        </td>
                      );
                    }
                    // bloqueo inicio
                    if(celda.tipo==="bloqueo_inicio"){
                      const {bloqueo,span}=celda;
                      const TIPOS_COLOR={"Bloqueado":"#9a9a9a","Reunión":"#4a7ac9","Curso":"#2a9a6a","Comida":"#c97a2a","Vacaciones":"#c94a9a"};
                      const bc=TIPOS_COLOR[bloqueo.tipo]||"#9a9a9a";
                      return(
                        <td key={cab} rowSpan={span}
                          onMouseEnter={()=>{if(bloqueoArrastrando===cab&&bloqueoHoraIni){const iS=SLOTS.indexOf(bloqueoHoraIni);const iC=SLOTS.indexOf(hora);setBloqueoHoraFin(SLOTS[Math.max(iS,iC)]);}}}
                          onMouseUp={()=>{if(bloqueoArrastrando===cab&&bloqueoHoraIni&&bloqueoHoraIni!==hora){setModalBloqueo({horaIni:bloqueoHoraIni,horaFin:bloqueoHoraFin||hora,cab});setFormBloqueo({tipo:"Bloqueado",nota:""});setBloqueoArrastrando(false);}}}
                          style={{border:"1px solid #f0e0ea",padding:"2px",verticalAlign:"top",height:`${span*14}px`}}>
                          <div style={{background:bc+"22",border:`1.5px dashed ${bc}`,borderRadius:"5px",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"3px",position:"relative"}}>
                            <div style={{fontSize:"0.69rem",fontWeight:700,color:bc,textAlign:"center"}}>{bloqueo.tipo}</div>
                            {bloqueo.nota&&<div style={{fontSize:"0.62rem",color:bc,opacity:0.8,textAlign:"center",marginTop:"1px"}}>{bloqueo.nota}</div>}
                            <button onClick={()=>borrarBloqueo(bloqueo.id)} style={{position:"absolute",top:"2px",right:"2px",background:"none",border:"none",color:bc,cursor:"pointer",fontSize:"0.7rem",lineHeight:1,opacity:0.7}}>✕</button>
                          </div>
                        </td>
                      );
                    }
                    // libre
                    return(
                      <td key={cab} style={{border:"1px solid #f0e0ea",padding:"2px",height:"14px",verticalAlign:"top",
                        cursor:bloqueoArrastrando?"ns-resize":"pointer",
                        background:celda.tipo==="bloqueo_preview"?"#e0e0e0":
                          dragOver?.hora===hora&&dragOver?.cab===cab?"#f5e0ff":
                          hora.endsWith(":00")?"white":"#fdfbff",
                        transition:"background 0.1s"}}
                        onClick={()=>{if(dragging||bloqueoArrastrando) return; openNew(hora,cab,STAFF[staffIdx]||STAFF[0]);}}
                        onMouseDown={e=>{e.preventDefault();setBloqueoArrastrando(cab);setBloqueoHoraIni(hora);setBloqueoHoraFin(hora);}}
                        onMouseEnter={()=>{
                          if(bloqueoArrastrando===cab&&bloqueoHoraIni){
                            const iS=SLOTS.indexOf(bloqueoHoraIni);
                            const iC=SLOTS.indexOf(hora);
                            setBloqueoHoraFin(SLOTS[Math.max(iS,iC)]);
                          }
                        }}
                        onMouseUp={()=>{
                          if(bloqueoArrastrando===cab&&bloqueoHoraIni){
                            const iS=SLOTS.indexOf(bloqueoHoraIni);
                            const iC=SLOTS.indexOf(hora);
                            if(iS===iC){
                              setBloqueoArrastrando(false);setBloqueoHoraIni(null);setBloqueoHoraFin(null);
                              openNew(hora,cab,STAFF[staffIdx]||STAFF[0]);
                            } else {
                              setModalBloqueo({horaIni:bloqueoHoraIni,horaFin:bloqueoHoraFin||hora,cab});
                              setFormBloqueo({tipo:"Bloqueado",nota:""});
                            }
                          }
                        }}
                        onDragOver={e=>{e.preventDefault();setDragOver({hora,cab});}}
                        onDragLeave={()=>setDragOver(null)}
                        onDrop={()=>handleDrop(hora,cab)}>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* Modal cita */}
      {modal==="form"&&(
        <Modal title={form.id?"Editar Cita":"Nueva Cita"} onClose={()=>setModal(null)} wide compact>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>

            {/* CLIENTE con buscador */}
            <Field label="Cliente" half>
              <Autocomplete
                value={form.clienteId}
                onChange={id=>setForm({...form,clienteId:id})}
                opciones={clientes}
                placeholder="Escribe nombre o teléfono..."
                getLabel={c=>`${c.nombre}${c.telefono?" · "+c.telefono:""}`}
                renderOpcion={c=>(
                  <div>
                    <span style={{fontWeight:600,color:"#3a1a2e"}}>{c.nombre}</span>
                    {c.telefono&&<span style={{fontSize:"0.78rem",color:"#aaa",marginLeft:"7px"}}>{c.telefono}</span>}
                  </div>
                )}
                onCrearNuevo={crearClienteRapido}
              />
            </Field>

            <Field label="Empleada" half>
              <select value={form.empleada} onChange={e=>setForm({...form,empleada:e.target.value})} style={inp} disabled={esRestringido}>
                {STAFF.map(s=><option key={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="Fecha" third>
              <input type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})} style={inp}/>
            </Field>
            <Field label="Hora inicio" third>
              <select value={form.hora} onChange={e=>setForm({...form,hora:e.target.value})} style={inp}>
                {(isSat(form.fecha)?SLOTS_SAT:SLOTS_WEEK).map(h=><option key={h}>{h}</option>)}
              </select>
            </Field>
            <Field label="Duración total (min)" third>
              <input
                type="number"
                value={(()=>{
                  const durSvs=(form.serviciosIds||[]).reduce((s,id)=>s+Number(servicios.find(x=>x.id===id)?.duracion||0),0);
                  return durSvs>0?durSvs:form.duracion||60;
                })()}
                onChange={e=>setForm({...form,duracion:e.target.value})}
                style={{...inp,background:"#f5f5f5"}}
                readOnly={(form.serviciosIds||[]).length>0}
              />
              {(form.serviciosIds||[]).length>0&&<div style={{fontSize:"0.7rem",color:"#9a6a8a",marginTop:"2px"}}>Calculado automáticamente según servicios</div>}
            </Field>
            <Field label="Cabina" half>
              <select value={form.cabina} onChange={e=>setForm({...form,cabina:e.target.value})} style={inp} disabled={esRestringido}>
                {CABINAS.map(c=><option key={c}>{c}</option>)}
              </select>
            </Field>
            {(()=>{
              const aparatos=(form.serviciosIds||[]).map(id=>servicios.find(s=>s.id===id)?.aparato).filter(Boolean);
              if(aparatos.length===0) return null;
              const durMin=Number((()=>{const d=(form.serviciosIds||[]).reduce((s,id)=>s+Number(servicios.find(x=>x.id===id)?.duracion||0),0);return d>0?d:Number(form.duracion||60);})());
              const [hh,mm]=(form.hora||"09:00").split(":").map(Number);
              const iniMin=hh*60+mm, finMin=iniMin+durMin;
              const conflictos=citas.filter(c=>{
                if(c.id===form.id||c.fecha!==form.fecha) return false;
                const svConf=(c.serviciosIds||[]).map(id=>servicios.find(s=>s.id===id)?.aparato).filter(a=>a&&aparatos.includes(a));
                if(svConf.length===0) return false;
                const [ch,cm]=c.hora.split(":").map(Number);
                const cIni=ch*60+cm, cFin=cIni+Number(c.duracion||60);
                return iniMin<cFin&&finMin>cIni;
              });
              if(conflictos.length===0) return null;
              const c0=conflictos[0];const cl0=clientes.find(x=>x.id===c0.clienteId);
              return(
                <div style={{flex:"1 1 100%"}}>
                  <div style={{background:"#fff0f0",border:"2px solid #d03030",borderRadius:"9px",padding:"10px 14px",fontSize:"0.83rem",color:"#c03030",fontWeight:600,lineHeight:1.5}}>
                    ⚠️ CONFLICTO DE APARATO — El equipo <strong>"{aparatos.join(" / ")}"</strong> ya está reservado a las {c0.hora} para {cl0?.nombre||"otra clienta"} en {c0.cabina}. Puedes guardar igualmente pero revisa disponibilidad.
                  </div>
                </div>
              );
            })()}
            {esAdmin&&(
              <Field label="Estado" half>
                <select value={form.cobrado?"cobrado":form.terminado?"terminado":"pendiente"} onChange={e=>setForm({...form,cobrado:e.target.value==="cobrado",terminado:e.target.value==="terminado"||e.target.value==="cobrado"})} style={inp}>
                  <option value="pendiente">⏳ En curso / Pendiente</option>
                  <option value="terminado">✅ Servicio terminado</option>
                  <option value="cobrado">💰 Cobrado ✓</option>
                </select>
              </Field>
            )}
            {!esAdmin&&(
              <Field label="Estado" half>
                <select value={form.terminado?"terminado":"pendiente"} onChange={e=>setForm({...form,terminado:e.target.value==="terminado"})} style={inp}>
                  <option value="pendiente">⏳ En curso</option>
                  <option value="terminado">✅ Terminado</option>
                </select>
              </Field>
            )}
            {esAdmin&&(()=>{
              // Buscar packs activos de esta clienta
              const packsCliente=form.clienteId
                ? (bonos||[]).filter(b=>b.clienteId===form.clienteId&&Number(b.sesionesUsadas||0)<Number(b.sesionesTotal||0))
                : [];
              const usandoPack=form.metodoPago==="Pack";
              return(
                <>
                  <Field label="Método de pago" half>
                    <select
                      value={form.metodoPago||"Tarjeta"}
                      onChange={e=>{
                        const val=e.target.value;
                        if(val==="Pack"){
                          setForm({...form,metodoPago:"Pack",bonoId:packsCliente[0]?.id||"",cobrado:true,terminado:true});
                        } else {
                          setForm({...form,metodoPago:val,bonoId:""});
                        }
                      }}
                      style={{...inp,borderColor:usandoPack?"#9a52c9":"#e8d5e0",background:usandoPack?"#f8f0ff":"#fdf8fb"}}
                    >
                      <option value="Efectivo">Efectivo</option>
                      <option value="Tarjeta">Tarjeta</option>
                      <option value="Bizum">Bizum</option>
                      <option value="Transferencia">Transferencia</option>
                      {packsCliente.length>0&&<option value="Pack">🎟️ Pack / Bono sesiones</option>}
                    </select>
                    {!form.clienteId&&<div style={{fontSize:"0.72rem",color:"#bbb",marginTop:"3px"}}>Selecciona una clienta para ver sus packs</div>}
                    {form.clienteId&&packsCliente.length>0&&!usandoPack&&(
                      <div style={{fontSize:"0.72rem",color:"#7a2a9a",marginTop:"3px",fontWeight:600,background:"#f5eaff",padding:"4px 8px",borderRadius:"5px"}}>
                        🎟️ Tiene {packsCliente.length} pack(s) activo(s) — selecciona "Pack / Bono sesiones" arriba
                      </div>
                    )}
                    {form.clienteId&&packsCliente.length===0&&<div style={{fontSize:"0.72rem",color:"#bbb",marginTop:"3px"}}>Esta clienta no tiene packs activos</div>}
                  </Field>
                  {usandoPack&&packsCliente.length>0&&(
                    <Field label="¿Qué pack usar?" half>
                      <select
                        value={form.bonoId||""}
                        onChange={e=>setForm({...form,bonoId:e.target.value})}
                        style={{...inp,borderColor:"#9a52c9",background:"#f8f0ff"}}
                      >
                        {packsCliente.map(b=>{
                          const rest=Number(b.sesionesTotal||0)-Number(b.sesionesUsadas||0);
                          return <option key={b.id} value={b.id}>{b.nombreBono||"Pack"} · {rest} sesión(es) restantes</option>;
                        })}
                      </select>
                      <div style={{fontSize:"0.73rem",color:"#7a2a9a",marginTop:"5px",background:"#f5eaff",padding:"6px 10px",borderRadius:"7px",fontWeight:600}}>
                        🎟️ Total = 0 € · Se descuenta 1 sesión del pack al guardar
                      </div>
                    </Field>
                  )}
                </>
              );
            })()}

            {/* SERVICIOS con buscador */}
            <Field label="Servicios">
              <input
                value={form.svBusq||""}
                onChange={e=>setForm({...form,svBusq:e.target.value})}
                placeholder="🔍 Escribe para filtrar servicios... ej: pier, facial, láser"
                style={{...inp,marginBottom:"6px"}}
              />
              <div style={{background:"#fdf8fb",border:"1.5px solid #e8d5e0",borderRadius:"8px",padding:"6px",maxHeight:"130px",overflowY:"auto"}}>
                {servicios.length===0&&<span style={{color:"#ccc",fontSize:"0.82rem"}}>Sin servicios — añádelos en Tarifas</span>}
                {svsFiltrados.length===0&&servicios.length>0&&<span style={{color:"#bbb",fontSize:"0.82rem"}}>Sin resultados para "{form.svBusq}"</span>}
                {svsFiltrados.map(sv=>{
                  const sel=(form.serviciosIds||[]).includes(sv.id);
                  return(
                    <label key={sv.id} style={{display:"flex",alignItems:"center",gap:"8px",padding:"5px 6px",borderRadius:"5px",cursor:"pointer",background:sel?"#f5eaf0":"transparent",marginBottom:"1px"}}>
                      <input type="checkbox" checked={sel} onChange={()=>{
                        const ids=form.serviciosIds||[];
                        setForm({...form,serviciosIds:sel?ids.filter(x=>x!==sv.id):[...ids,sv.id]});
                      }}/>
                      <span style={{flex:1,fontSize:"0.83rem",color:"#3a1a2e"}}>{sv.nombre}</span>
                      {sv.duracion&&<span style={{fontSize:"0.75rem",color:"#bbb"}}>{sv.duracion}min</span>}
                      <span style={{fontSize:"0.8rem",color:"#9a6a8a",fontWeight:600,minWidth:"50px",textAlign:"right"}}>{fmtM(sv.precio)}</span>
                    </label>
                  );
                })}
              </div>
              {(form.serviciosIds||[]).length>0&&(
                <div style={{display:"flex",justifyContent:"space-between",marginTop:"5px",fontSize:"0.82rem"}}>
                  <span style={{color:"#9a6a8a"}}>{(form.serviciosIds||[]).length} servicio(s) seleccionado(s)</span>
                  <span style={{fontWeight:700,color:"#c9527a"}}>Total: {fmtM((form.serviciosIds||[]).reduce((s,id)=>s+Number(servicios.find(x=>x.id===id)?.precio||0),0))}</span>
                </div>
              )}
            </Field>

            <Field label="Notas">
              <textarea value={form.notas||""} onChange={e=>setForm({...form,notas:e.target.value})} style={{...inp,height:"42px",resize:"vertical"}}/>
            </Field>
          </div>
          {form.id&&(
            <div style={{marginBottom:"8px",display:"flex",justifyContent:"flex-start"}}>
              <button onClick={()=>{
                const nueva={...form,id:null,cobrado:false,terminado:false};
                setForm(nueva);
                // Abrir mismo modal con id null = nueva cita copiada
              }} style={{...btn("#f5eaff","#7a2a9a"),fontSize:"0.78rem",padding:"5px 12px"}}>
                📋 Copiar como nueva cita (reagendar)
              </button>
            </div>
          )}
          <Actions onSave={guardar} onDelete={()=>{onDelete(form.id);setModal(null);}} onCancel={()=>setModal(null)} isNew={!form.id}/>
        </Modal>
      )}

      {/* Modal bloqueo */}
      {modalBloqueo&&(
        <Modal title="🔒 Bloquear espacio" onClose={()=>{setModalBloqueo(null);setBloqueoArrastrando(false);setBloqueoHoraIni(null);setBloqueoHoraFin(null);}}>
          {(()=>{const ci=CABINAS.indexOf(modalBloqueo.cab);const color=ci>=0?COLORS_STAFF[ci]:"#777";return(
            <div style={{background:"#f5f5f5",borderRadius:"8px",padding:"8px 12px",marginBottom:"12px",display:"flex",gap:"10px",alignItems:"center"}}>
              <span style={{fontWeight:700,color,fontSize:"0.9rem"}}>{STAFF[ci]||modalBloqueo.cab}</span>
              <span style={{color:"#aaa",fontSize:"0.82rem"}}>·</span>
              <span style={{fontSize:"0.84rem",color:"#555"}}>{modalBloqueo.horaIni} – {modalBloqueo.horaFin}</span>
            </div>
          );})()}
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Tipo" half>
              <select value={formBloqueo.tipo} onChange={e=>setFormBloqueo({...formBloqueo,tipo:e.target.value})} style={inp}>
                {["Bloqueado","Reunión","Curso","Comida","Vacaciones"].map(t=><option key={t}>{t}</option>)}
              </select>
            </Field>
            <Field label="Nota (opcional)" half>
              <input value={formBloqueo.nota} onChange={e=>setFormBloqueo({...formBloqueo,nota:e.target.value})} placeholder="Ej: reunión con proveedor" style={inp}/>
            </Field>
          </div>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"12px"}}>
            <button onClick={()=>{setModalBloqueo(null);setBloqueoArrastrando(false);setBloqueoHoraIni(null);setBloqueoHoraFin(null);}} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
            <button onClick={guardarBloqueo} style={btn("#555")}>🔒 Bloquear</button>
          </div>
        </Modal>
      )}

      {/* Modal nueva clienta rápida */}
      {modalNuevaClientа&&(
        <Modal title="Nueva clienta rápida" onClose={()=>setModalNuevaCliente(false)}>
          <p style={{fontSize:"0.83rem",color:"#9a6a8a",marginBottom:"14px"}}>Rellena los datos mínimos ahora. Puedes completar el resto después en la pestaña Clientes.</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Nombre completo"><input value={formNuevaCliente.nombre||""} onChange={e=>setFormNuevaCliente({...formNuevaCliente,nombre:e.target.value})} style={inp}/></Field>
            <Field label="Teléfono" half><input value={formNuevaCliente.telefono||""} onChange={e=>setFormNuevaCliente({...formNuevaCliente,telefono:e.target.value})} style={inp}/></Field>
            <Field label="Email" half><input value={formNuevaCliente.email||""} onChange={e=>setFormNuevaCliente({...formNuevaCliente,email:e.target.value})} style={inp}/></Field>
            <Field label="⚠️ Alergias"><input value={formNuevaCliente.alergias||""} onChange={e=>setFormNuevaCliente({...formNuevaCliente,alergias:e.target.value})} style={inp}/></Field>
          </div>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
            <button onClick={()=>setModalNuevaCliente(false)} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
            <button onClick={guardarNuevaCliente} style={btn()}>💾 Guardar y asignar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── CLIENTES ─────────────────────────────────────────────────────────────────
function Clientes({clientes,citas,servicios,bonos,onAdd,onBulkAdd,onEdit,onDelete}){
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [detalle,setDetalle]=useState(null);
  const [detalleTab,setDetalleTab]=useState("datos");
  const [importModal,setImportModal]=useState(false);
  const [csvPreview,setCsvPreview]=useState([]);
  const [csvError,setCsvError]=useState("");
  const fileRef=useRef();

  const filtered=clientes.filter(c=>
    (c.nombre||"").toLowerCase().includes(search.toLowerCase())||
    (c.telefono||"").includes(search)||
    (c.email||"").toLowerCase().includes(search.toLowerCase())
  );

  function guardar(){
    if(!form.nombre) return;
    if(modal==="new") onAdd({...form,id:uid()});
    else onEdit({...form});
    setModal(null);
  }

  function handleFile(e){
    const file=e.target.files[0]; if(!file) return;
    setCsvError("");
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const text=ev.target.result;
        const lines=text.split(/\r?\n/).filter(l=>l.trim());
        const headers=lines[0].split(/[,;]/).map(h=>h.trim().toLowerCase().replace(/"/g,""));
        const rows=lines.slice(1).map(line=>{
          const vals=line.split(/[,;]/).map(v=>v.trim().replace(/^"|"$/g,""));
          const obj={};
          headers.forEach((h,i)=>{obj[h]=vals[i]||"";});
          return obj;
        }).filter(r=>r[headers[0]]);
        const map=(row,...keys)=>{for(const k of keys){if(row[k]&&row[k].trim())return row[k].trim();}return"";};
        // Detectar si es formato Treatwell (tiene columnas "Nombre" y "Apellido" separadas)
        const esTreatwell=headers.includes("nombre")&&headers.includes("apellido");
        const mapped=rows.map(r=>{
          // Nombre completo: si tiene columna "nombre" con nombre completo la usamos,
          // si no, combinamos "nombre" + "apellido" del formato Treatwell
          let nombreCompleto="";
          if(esTreatwell){
            // En Treatwell: primera columna "nombre" = nombre completo, "Nombre" = solo nombre, "Apellido" = apellidos
            const primerCol=r[headers[0]]||"";
            const soloNombre=map(r,"nombre");
            const apellido=map(r,"apellido");
            // Si la primera columna tiene más de una palabra, es el nombre completo
            if(primerCol.trim().split(" ").length>1) nombreCompleto=primerCol.trim();
            else if(soloNombre&&apellido) nombreCompleto=`${soloNombre} ${apellido}`.trim();
            else nombreCompleto=primerCol.trim()||soloNombre;
          } else {
            nombreCompleto=map(r,"nombre","name","cliente","full name","nombre completo");
          }
          // Teléfono: limpiar espacios y el prefijo +34 si se quiere
          const telRaw=map(r,"teléfono","telefono","phone","tel","móvil","movil","mobile");
          const tel=telRaw.replace(/\s/g,""); // quitar espacios pero mantener +34
          // Fecha nacimiento: Treatwell usa columna "fecha de nacimiento"
          const fnac=map(r,"fecha de nacimiento","fechanacimiento","birth","nacimiento","birthday","fecha_nacimiento");
          // Notas
          const notas=map(r,"notas","notes","observaciones");
          return {
            id:uid(),
            nombre:nombreCompleto,
            telefono:tel,
            email:map(r,"email","correo","e-mail","mail"),
            fechaNac:fnac,
            dni:map(r,"dni","nif","documento"),
            direccion:map(r,"dirección","direccion","address"),
            alergias:"",
            tipoPiel:"",
            observaciones:notas,
            origen:"Treatwell",
          };
        }).filter(r=>r.nombre);
        setCsvPreview(mapped);
        if(mapped.length===0) setCsvError("No se encontraron clientes. Asegúrate de que el CSV tiene cabeceras.");
      }catch(err){ setCsvError("Error leyendo el archivo. Intenta exportarlo de nuevo desde Treatwell."); }
    };
    reader.readAsText(file,"UTF-8");
  }

  return(
    <div>
      <div style={{display:"flex",gap:"10px",marginBottom:"16px",flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Nombre, teléfono o email..." style={{...inp,maxWidth:"300px",flex:1}}/>
        <button onClick={()=>{setForm({nombre:"",telefono:"",email:"",fechaNac:"",dni:"",direccion:"",alergias:"",tipoPiel:"",origen:"",observaciones:""});setModal("new");}} style={btn()}>+ Nueva clienta</button>
        <button onClick={()=>setImportModal(true)} style={btn("#5a8ac9")}>📥 Importar CSV</button>
        <button onClick={()=>{
          const filas=[["Nombre","Teléfono","Email","Fecha Nac","Tipo Piel","Origen","Observaciones","Visitas","Últ. visita"],
            ...filtered.map(c=>{const cc=citas.filter(ci=>ci.clienteId===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));return[c.nombre,c.telefono,c.email,fmt(c.fechaNac),c.tipoPiel,c.origen,c.observaciones,cc.length,fmt(cc[0]?.fecha)];})];
          exportarCSV(filas,"clientas_starwappas");
        }} style={btn("#2a7a4a")}>📊 Exportar</button>
        <span style={{alignSelf:"center",fontSize:"0.82rem",color:"#9a6a8a"}}>{filtered.length} clientas</span>
      </div>

      <div style={{background:"white",borderRadius:"12px",overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.05)"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:"#fdf0f5"}}>
              {["Nombre","Teléfono","Email","Últ. visita","Visitas",""].map(h=>(
                <th key={h} style={{padding:"10px 13px",textAlign:"left",fontSize:"0.71rem",fontWeight:700,color:"#9a6a8a",textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={6} style={{padding:"40px",textAlign:"center",color:"#ccc"}}>Sin clientas registradas</td></tr>}
            {filtered.map((c,i)=>{
              const cc=citas.filter(ci=>ci.clienteId===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
              return(
                <tr key={c.id} style={{borderTop:"1px solid #f5eaf0",background:i%2===0?"white":"#fdf8fb"}}>
                  <td style={{padding:"9px 13px",fontWeight:600,color:"#3a1a2e",cursor:"pointer"}} onClick={()=>setDetalle(c)}>{c.nombre}</td>
                  <td style={{padding:"9px 13px",fontSize:"0.85rem",color:"#555"}}>{c.telefono||"—"}</td>
                  <td style={{padding:"9px 13px",fontSize:"0.82rem",color:"#555"}}>{c.email||"—"}</td>
                  <td style={{padding:"9px 13px",fontSize:"0.82rem",color:"#555"}}>{cc[0]?fmt(cc[0].fecha):"—"}</td>
                  <td style={{padding:"9px 13px"}}><span style={{background:"#f0e0ea",color:"#c9527a",borderRadius:"8px",padding:"2px 8px",fontSize:"0.8rem",fontWeight:700}}>{cc.length}</span></td>
                  <td style={{padding:"9px 13px"}}>
                    <div style={{display:"flex",gap:"5px"}}>
                      <button onClick={()=>setDetalle(c)} style={{...btn("#f0e8f5","#7a4a8a"),padding:"4px 9px",fontSize:"0.75rem"}}>Ver</button>
                      <button onClick={()=>{setForm({...c});setModal("edit");}} style={{...btn("#f0e0ea","#3a1a2e"),padding:"4px 9px",fontSize:"0.75rem"}}>✏️</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {(modal==="new"||modal==="edit")&&(
        <Modal title={modal==="new"?"Nueva Clienta":"Editar Clienta"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Nombre completo"><input value={form.nombre||""} onChange={e=>setForm({...form,nombre:e.target.value})} style={inp}/></Field>
            <Field label="Teléfono" half><input value={form.telefono||""} onChange={e=>setForm({...form,telefono:e.target.value})} style={inp}/></Field>
            <Field label="Email" half><input type="email" value={form.email||""} onChange={e=>setForm({...form,email:e.target.value})} style={inp}/></Field>
            <Field label="Fecha de nacimiento" half><input type="date" value={form.fechaNac||""} onChange={e=>setForm({...form,fechaNac:e.target.value})} style={inp}/></Field>
            <Field label="DNI / NIF" half><input value={form.dni||""} onChange={e=>setForm({...form,dni:e.target.value})} style={inp}/></Field>
            <Field label="Dirección"><input value={form.direccion||""} onChange={e=>setForm({...form,direccion:e.target.value})} style={inp}/></Field>
            <Field label="Tipo de piel" half>
              <select value={form.tipoPiel||""} onChange={e=>setForm({...form,tipoPiel:e.target.value})} style={inp}>
                <option value="">—</option>
                {["Normal","Seca","Grasa","Mixta","Sensible","Madura","Acneica"].map(t=><option key={t}>{t}</option>)}
              </select>
            </Field>
            <Field label="Cómo nos conoció" half>
              <select value={form.origen||""} onChange={e=>setForm({...form,origen:e.target.value})} style={inp}>
                <option value="">—</option>
                {["Recomendación","Instagram","Google","Pasando por la calle","Treatwell","Otro"].map(t=><option key={t}>{t}</option>)}
              </select>
            </Field>
            <Field label="⚠️ Alergias / Contraindicaciones"><textarea value={form.alergias||""} onChange={e=>setForm({...form,alergias:e.target.value})} style={{...inp,height:"55px",resize:"vertical"}}/></Field>
            <Field label="Observaciones"><textarea value={form.observaciones||""} onChange={e=>setForm({...form,observaciones:e.target.value})} style={{...inp,height:"55px",resize:"vertical"}}/></Field>
          </div>
          <Actions onSave={guardar} onDelete={()=>{onDelete(form.id);setModal(null);}} onCancel={()=>setModal(null)} isNew={modal==="new"}/>
        </Modal>
      )}

      {detalle&&(
        <Modal title={`Ficha · ${detalle.nombre}`} onClose={()=>{setDetalle(null);setDetalleTab("datos");}} wide>
          {/* Tabs */}
          <div style={{display:"flex",gap:"4px",marginBottom:"18px",borderBottom:"2px solid #f0e0ea",paddingBottom:"0"}}>
            {[["datos","👤 Datos"],["historial","📋 Historial"],["bonos","🎟️ Bonos"]].map(([id,lab])=>(
              <button key={id} onClick={()=>setDetalleTab(id)} style={{background:"none",border:"none",padding:"7px 14px",cursor:"pointer",fontSize:"0.82rem",fontWeight:700,color:detalleTab===id?"#c9527a":"#9a8090",borderBottom:detalleTab===id?"2.5px solid #c9527a":"2.5px solid transparent",marginBottom:"-2px",fontFamily:"inherit"}}>
                {lab}
              </button>
            ))}
            <div style={{marginLeft:"auto",alignSelf:"center"}}>
              <button onClick={()=>{setForm({...detalle});setDetalle(null);setModal("edit");}} style={{...btn(),padding:"5px 13px",fontSize:"0.78rem"}}>✏️ Editar</button>
            </div>
          </div>

          {/* Tab: Datos */}
          {detalleTab==="datos"&&(
            <div>
              {[["📱","Teléfono",detalle.telefono],["✉️","Email",detalle.email],["🎂","Fecha nac.",fmt(detalle.fechaNac)],["🪪","DNI/NIF",detalle.dni],["📍","Dirección",detalle.direccion],["🧴","Tipo de piel",detalle.tipoPiel],["💬","Cómo nos conoció",detalle.origen]].filter(([,,v])=>v).map(([k,lab,v])=>(
                <div key={k} style={{display:"flex",gap:"8px",marginBottom:"7px",fontSize:"0.86rem",alignItems:"flex-start"}}>
                  <span style={{minWidth:"22px"}}>{k}</span>
                  <span style={{color:"#9a6a8a",fontSize:"0.75rem",fontWeight:700,minWidth:"100px",paddingTop:"1px"}}>{lab}</span>
                  <span style={{color:"#3a1a2e",fontWeight:500}}>{v}</span>
                </div>
              ))}
              {detalle.alergias&&<div style={{marginTop:"12px",background:"#fff5f0",border:"1.5px solid #fcc",borderRadius:"9px",padding:"11px",fontSize:"0.83rem"}}><strong>⚠️ Alergias / Contraindicaciones:</strong><div style={{marginTop:"4px"}}>{detalle.alergias}</div></div>}
              {detalle.observaciones&&<div style={{marginTop:"8px",background:"#f5f0ff",borderRadius:"9px",padding:"11px",fontSize:"0.83rem"}}><strong>📝 Observaciones:</strong><div style={{marginTop:"4px"}}>{detalle.observaciones}</div></div>}
              {(()=>{
                const cc=citas.filter(c=>c.clienteId===detalle.id);
                const total=cc.filter(c=>c.cobrado).reduce((s,c)=>s+Number(c.total||0),0);
                return cc.length>0?(
                  <div style={{marginTop:"12px",display:"flex",gap:"10px",flexWrap:"wrap"}}>
                    <div style={{background:"#f0e8ff",borderRadius:"8px",padding:"10px 14px",textAlign:"center",flex:"1 1 80px"}}>
                      <div style={{fontSize:"1.1rem",fontWeight:800,color:"#7a2a9a",fontFamily:"Cormorant Garamond,serif"}}>{cc.length}</div>
                      <div style={{fontSize:"0.7rem",color:"#9a6a8a",fontWeight:700}}>Visitas</div>
                    </div>
                    <div style={{background:"#f0fff0",borderRadius:"8px",padding:"10px 14px",textAlign:"center",flex:"1 1 80px"}}>
                      <div style={{fontSize:"1.1rem",fontWeight:800,color:"#2a7a4a",fontFamily:"Cormorant Garamond,serif"}}>{fmtM(total)}</div>
                      <div style={{fontSize:"0.7rem",color:"#9a6a8a",fontWeight:700}}>Total gastado</div>
                    </div>
                    <div style={{background:"#fff0e8",borderRadius:"8px",padding:"10px 14px",textAlign:"center",flex:"1 1 80px"}}>
                      <div style={{fontSize:"1.1rem",fontWeight:800,color:"#9a6a2a",fontFamily:"Cormorant Garamond,serif"}}>{fmt(cc.sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]?.fecha)}</div>
                      <div style={{fontSize:"0.7rem",color:"#9a6a8a",fontWeight:700}}>Última visita</div>
                    </div>
                  </div>
                ):null;
              })()}
            </div>
          )}

          {/* Tab: Historial */}
          {detalleTab==="historial"&&(
            <div style={{maxHeight:"400px",overflowY:"auto"}}>
              {citas.filter(c=>c.clienteId===detalle.id).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(c=>{
                const svs=(c.serviciosIds||[]).map(id=>servicios.find(s=>s.id===id)?.nombre).filter(Boolean);
                const si=STAFF.indexOf(c.empleada);
                const col=si>=0?COLORS_STAFF[si]:"#c9527a";
                return(
                  <div key={c.id} style={{borderLeft:`3px solid ${col}`,paddingLeft:"12px",marginBottom:"12px",paddingBottom:"12px",borderBottom:"1px solid #f5eaf0"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                      <div>
                        <div style={{fontSize:"0.82rem",fontWeight:700,color:"#3a1a2e"}}>{fmt(c.fecha)} · {c.hora}</div>
                        <div style={{fontSize:"0.8rem",color:"#666",marginTop:"2px"}}>{svs.join(", ")||"—"}</div>
                        <div style={{fontSize:"0.74rem",color:"#9a6a8a",marginTop:"1px"}}>{c.empleada} · {c.cabina}</div>
                        {c.notas&&<div style={{fontSize:"0.74rem",color:"#aaa",marginTop:"2px",fontStyle:"italic"}}>📝 {c.notas}</div>}
                      </div>
                      <div style={{textAlign:"right",flexShrink:0,marginLeft:"10px"}}>
                        {c.total>0&&<div style={{fontSize:"0.86rem",color:"#c9527a",fontWeight:700}}>{fmtM(c.total)}</div>}
                        <div style={{fontSize:"0.73rem",marginTop:"2px"}}>
                          {c.cobrado?<span style={{color:"#2a7a4a",fontWeight:700}}>✓ Cobrado</span>:c.terminado?<span style={{color:"#9a6a2a"}}>Terminado</span>:<span style={{color:"#9a9a9a"}}>Pendiente</span>}
                        </div>
                        {c.metodoPago&&<div style={{fontSize:"0.7rem",color:"#bbb"}}>{c.metodoPago}</div>}
                      </div>
                    </div>
                  </div>
                );
              })}
              {citas.filter(c=>c.clienteId===detalle.id).length===0&&<div style={{textAlign:"center",padding:"30px",color:"#ccc",fontSize:"0.84rem"}}>Sin visitas registradas</div>}
            </div>
          )}

          {/* Tab: Bonos */}
          {detalleTab==="bonos"&&(
            <div>
              {(()=>{
                const bonosCl=bonos.filter(b=>b.clienteId===detalle.id);
                if(bonosCl.length===0) return <div style={{textAlign:"center",padding:"30px",color:"#ccc",fontSize:"0.84rem"}}>Sin bonos / packs activos</div>;
                return bonosCl.map(b=>{
                  const us=Number(b.sesionesUsadas||0),tot=Number(b.sesionesTotal||0);
                  const agot=us>=tot;
                  const pct=tot>0?Math.min(100,us/tot*100):0;
                  return(
                    <div key={b.id} style={{background:agot?"#fff0f0":"#f5eaff",borderRadius:"10px",padding:"13px 15px",marginBottom:"10px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div>
                          <div style={{fontWeight:700,color:"#3a1a2e",fontSize:"0.9rem"}}>{b.nombreBono||"Bono"}</div>
                          {b.precio&&<div style={{fontSize:"0.77rem",color:"#9a6a8a",marginTop:"2px"}}>Pagado: {fmtM(b.precio)}</div>}
                          {b.fechaCreacion&&<div style={{fontSize:"0.73rem",color:"#bbb"}}>Creado: {fmt(b.fechaCreacion)}</div>}
                        </div>
                        <div style={{textAlign:"right"}}>
                          <span style={{fontWeight:800,color:agot?"#cc3030":"#7a2a9a",fontSize:"1.1rem",fontFamily:"Cormorant Garamond,serif"}}>{us}/{tot}</span>
                          <div style={{fontSize:"0.72rem",color:agot?"#cc3030":"#9a6a8a"}}>{agot?"AGOTADO":`${tot-us} restantes`}</div>
                        </div>
                      </div>
                      <div style={{background:"#e0d0f0",borderRadius:"4px",height:"5px",marginTop:"10px"}}>
                        <div style={{background:agot?"#cc3030":"#9a52c9",borderRadius:"4px",height:"5px",width:`${pct}%`,transition:"width 0.3s"}}/>
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </Modal>
      )}

      {importModal&&(
        <Modal title="📥 Importar desde CSV (Treatwell)" onClose={()=>{setImportModal(false);setCsvPreview([]);setCsvError("");}} wide>
          <div style={{background:"#f0f8ff",border:"1px solid #b0d8f0",borderRadius:"10px",padding:"13px",fontSize:"0.84rem",marginBottom:"14px",lineHeight:1.6}}>
            <strong>Treatwell:</strong> Ve a Clientes → Exportar → Guardar como CSV. El archivo necesita al menos columnas de nombre, teléfono y email.
          </div>
          <input ref={fileRef} type="file" accept=".csv,.txt" onChange={handleFile} style={{display:"none"}}/>
          <button onClick={()=>fileRef.current.click()} style={{...btn("#5a8ac9"),marginBottom:"14px"}}>📂 Seleccionar archivo CSV</button>
          {csvError&&<div style={{background:"#ffe0e0",borderRadius:"8px",padding:"10px",fontSize:"0.84rem",color:"#c03030",marginBottom:"12px"}}>{csvError}</div>}
          {csvPreview.length>0&&(
            <>
              <div style={{fontSize:"0.84rem",color:"#2a7a4a",fontWeight:600,marginBottom:"8px"}}>✅ {csvPreview.length} clientes encontrados</div>
              <div style={{maxHeight:"200px",overflowY:"auto",border:"1px solid #f0e0ea",borderRadius:"8px",marginBottom:"13px"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:"0.79rem"}}>
                  <thead><tr style={{background:"#fdf0f5"}}>{["Nombre","Teléfono","Email"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#9a6a8a"}}>{h}</th>)}</tr></thead>
                  <tbody>
                    {csvPreview.slice(0,8).map((r,i)=>(
                      <tr key={i} style={{borderTop:"1px solid #f5eaf0"}}>
                        <td style={{padding:"5px 10px"}}>{r.nombre}</td>
                        <td style={{padding:"5px 10px"}}>{r.telefono}</td>
                        <td style={{padding:"5px 10px"}}>{r.email}</td>
                      </tr>
                    ))}
                    {csvPreview.length>8&&<tr><td colSpan={3} style={{padding:"7px 10px",color:"#9a6a8a",fontSize:"0.77rem"}}>...y {csvPreview.length-8} más</td></tr>}
                  </tbody>
                </table>
              </div>
              <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
                <button onClick={()=>setCsvPreview([])} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
                <button onClick={()=>{onBulkAdd(csvPreview);setCsvPreview([]);setImportModal(false);}} style={btn("#2a7a4a")}>✅ Importar {csvPreview.length} clientes</button>
              </div>
            </>
          )}
        </Modal>
      )}
    </div>
  );
}

// ─── TARIFAS ─────────────────────────────────────────────────────────────────
function Tarifas({servicios,onAdd,onEdit,onDelete}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [search,setSearch]=useState("");
  const filtered=servicios.filter(s=>(s.nombre||"").toLowerCase().includes(search.toLowerCase())||(s.categoria||"").toLowerCase().includes(search.toLowerCase()));
  const cats=[...new Set(servicios.map(s=>s.categoria).filter(Boolean))];
  function guardar(){
    if(!form.nombre||!form.precio) return;
    if(modal==="new") onAdd({...form,id:uid()});
    else onEdit({...form});
    setModal(null);
  }
  const grupos=[...cats.map(cat=>({cat,items:filtered.filter(s=>s.categoria===cat)})),{cat:"Sin categoría",items:filtered.filter(s=>!s.categoria)}].filter(g=>g.items.length>0);
  return(
    <div>
      <div style={{display:"flex",gap:"10px",marginBottom:"16px",flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar servicio..." style={{...inp,maxWidth:"280px",flex:1}}/>
        <button onClick={()=>{setForm({nombre:"",categoria:"",precio:"",iva:"21%",duracion:"60",descripcion:"",activo:true});setModal("new");}} style={btn()}>+ Añadir servicio</button>
      </div>
      {grupos.map(({cat,items})=>(
        <div key={cat} style={{marginBottom:"18px"}}>
          <div style={{fontSize:"0.74rem",fontWeight:700,color:"#9a6a8a",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"7px",paddingLeft:"3px"}}>{cat}</div>
          <div style={{background:"white",borderRadius:"12px",overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
            {items.map((s,i)=>(
              <div key={s.id} style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 15px",borderTop:i>0?"1px solid #f5eaf0":"none",background:!s.activo?"#f8f8f8":"white"}}>
                <div style={{flex:1}}>
                  <span style={{fontWeight:600,color:s.activo?"#3a1a2e":"#aaa",fontSize:"0.88rem"}}>{s.nombre}</span>
                  {s.descripcion&&<span style={{fontSize:"0.77rem",color:"#bbb",marginLeft:"7px"}}>{s.descripcion}</span>}
                {s.aparato&&<span style={{fontSize:"0.71rem",background:"#fff3e0",color:"#9a6a2a",borderRadius:"5px",padding:"1px 6px",marginLeft:"5px"}}>⚙️ {s.aparato}</span>}
                </div>
                <span style={{fontSize:"0.77rem",color:"#bbb"}}>{s.duracion||"—"} min</span>
                <span style={{fontSize:"0.77rem",color:"#aaa"}}>{s.iva||"21%"}</span>
                <span style={{fontWeight:700,color:"#c9527a",fontSize:"0.93rem",minWidth:"65px",textAlign:"right"}}>{fmtM(s.precio)}</span>
                <button onClick={()=>{setForm({...s});setModal("edit");}} style={{...btn("#f0e0ea","#3a1a2e"),padding:"4px 9px",fontSize:"0.73rem"}}>✏️</button>
              </div>
            ))}
          </div>
        </div>
      ))}
      {filtered.length===0&&<div style={{textAlign:"center",padding:"40px",color:"#ccc"}}>Sin servicios — añade tu primera tarifa</div>}
      {(modal==="new"||modal==="edit")&&(
        <Modal title={modal==="new"?"Nuevo Servicio":"Editar Servicio"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Nombre del servicio"><input value={form.nombre||""} onChange={e=>setForm({...form,nombre:e.target.value})} style={inp}/></Field>
            <Field label="Categoría" half><input value={form.categoria||""} onChange={e=>setForm({...form,categoria:e.target.value})} style={inp} placeholder="Facial, Corporal, Depilación..."/></Field>
            <Field label="Duración (min)" half>
              <select value={form.duracion||"60"} onChange={e=>setForm({...form,duracion:e.target.value})} style={inp}>
                {["15","30","45","60","75","90","120","150","180"].map(d=><option key={d}>{d}</option>)}
              </select>
            </Field>
            <Field label="Precio (€)" half><input type="number" step="0.01" value={form.precio||""} onChange={e=>setForm({...form,precio:e.target.value})} style={inp}/></Field>
            <Field label="IVA" half>
              <select value={form.iva||"21%"} onChange={e=>setForm({...form,iva:e.target.value})} style={inp}>
                {IVA_OPTIONS.map(v=><option key={v}>{v}</option>)}
              </select>
            </Field>
            <Field label="Descripción opcional" half><input value={form.descripcion||""} onChange={e=>setForm({...form,descripcion:e.target.value})} style={inp}/></Field>
            <Field label="Aparato / Equipo" half><input value={form.aparato||""} onChange={e=>setForm({...form,aparato:e.target.value})} style={inp} placeholder="Ej: Láser Alma, Cavitador..."/></Field>
          </div>
          <Actions onSave={guardar} onDelete={()=>{onDelete(form.id);setModal(null);}} onCancel={()=>setModal(null)} isNew={modal==="new"}/>
        </Modal>
      )}
    </div>
  );
}

// ─── TICKETS ─────────────────────────────────────────────────────────────────
function Tickets({citas,clientes,servicios,config,onCancelarTicket}){
  const [busq,setBusq]=useState("");
  const [ticketModal,setTicketModal]=useState(null);
  const [modo,setModo]=useState("ticket");
  const [factNum,setFactNum]=useState("");
  const [metPago,setMetPago]=useState("Tarjeta");
  const [factDni,setFactDni]=useState("");
  const [factDireccion,setFactDireccion]=useState("");
  const [factNombre,setFactNombre]=useState("");

  const cobradas=citas.filter(c=>c.cobrado&&(c.serviciosIds||[]).length>0).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const filtered=cobradas.filter(c=>{
    const cl=clientes.find(x=>x.id===c.clienteId);
    return(cl?.nombre||"").toLowerCase().includes(busq.toLowerCase())||c.fecha.includes(busq);
  });

  function abrir(cita){
    const num=`F${new Date().getFullYear()}-${String(cobradas.indexOf(cita)+1).padStart(4,"0")}`;
    const cl=clientes.find(x=>x.id===cita.clienteId);
    setFactNum(num); setMetPago(cita.metodoPago||"Tarjeta");
    setFactDni(cl?.dni||""); setFactDireccion(cl?.direccion||""); setFactNombre(cl?.nombre||"");
    setTicketModal(cita); setModo("ticket");
  }

  const Doc=({cita})=>{
    const cl=clientes.find(x=>x.id===cita.clienteId);
    const svs=(cita.serviciosIds||[]).map(id=>servicios.find(s=>s.id===id)).filter(Boolean);
    const subtotal=svs.reduce((s,sv)=>s+Number(sv.precio||0),0);
    const ivaG={};
    svs.forEach(sv=>{
      const k=sv.iva||"21%", pct=parseFloat(k)/100;
      const base=Number(sv.precio||0)/(1+pct), cuota=Number(sv.precio||0)-base;
      if(!ivaG[k]) ivaG[k]={base:0,cuota:0,k};
      ivaG[k].base+=base; ivaG[k].cuota+=cuota;
    });
    return(
      <div id="ticket-print" style={{fontFamily:"'DM Sans',sans-serif",maxWidth:"460px",margin:"0 auto",padding:"26px",border:"1px solid #f0e0ea",borderRadius:"12px"}}>
        <div style={{textAlign:"center",marginBottom:"18px",paddingBottom:"14px",borderBottom:"2px solid #f0e0ea"}}>
          {config.logoUrl&&<img src={config.logoUrl} alt="logo" style={{height:"45px",marginBottom:"7px"}}/>}
          <div style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.35rem",fontWeight:700,color:"#3a1a2e"}}>{config.nombreEmpresa||"Star Wappas"}</div>
          <div style={{fontSize:"0.78rem",color:"#555",marginTop:"3px",fontWeight:600}}>Antonia Villalba Gil</div>
          <div style={{fontSize:"0.76rem",color:"#666"}}>DNI: 38498971-F</div>
          <div style={{fontSize:"0.76rem",color:"#666"}}>C/ de Les Flors, 40-52 · El Vendrell · 43700 Tarragona</div>
          {config.telefono&&<div style={{fontSize:"0.76rem",color:"#666"}}>{config.telefono}</div>}
        </div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"13px"}}>
          <div>
            <div style={{fontWeight:700,color:"#c9527a",fontSize:"0.97rem"}}>{modo==="factura"?"FACTURA":"TICKET"} {modo==="factura"?factNum:""}</div>
            <div style={{fontSize:"0.78rem",color:"#666"}}>Fecha: {fmt(cita.fecha)}</div>
            <div style={{fontSize:"0.78rem",color:"#666"}}>Atendido por: {cita.empleada}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontWeight:600,color:"#3a1a2e",fontSize:"0.86rem"}}>{factNombre||cl?.nombre||"—"}</div>
            {(modo==="factura"||subtotal>=400)&&factDni&&<div style={{fontSize:"0.76rem",color:"#666"}}>DNI/NIF: {factDni}</div>}
            {(modo==="factura"||subtotal>=400)&&factDireccion&&<div style={{fontSize:"0.76rem",color:"#666",whiteSpace:"pre-line"}}>{factDireccion}</div>}
            {modo==="factura"&&(!factDni||!factDireccion)&&(
              <div style={{fontSize:"0.7rem",color:"#c03030",background:"#ffe0e0",borderRadius:"5px",padding:"3px 6px",marginTop:"3px"}}>⚠️ Faltan DNI o dirección</div>
            )}
          </div>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",marginBottom:"13px"}}>
          <thead>
            <tr style={{borderBottom:"1px solid #f0e0ea"}}>
              <th style={{textAlign:"left",fontSize:"0.71rem",color:"#9a6a8a",padding:"4px 0",fontWeight:700,textTransform:"uppercase"}}>Servicio</th>
              <th style={{textAlign:"center",fontSize:"0.71rem",color:"#9a6a8a",padding:"4px 0",fontWeight:700,textTransform:"uppercase"}}>IVA</th>
              <th style={{textAlign:"right",fontSize:"0.71rem",color:"#9a6a8a",padding:"4px 0",fontWeight:700,textTransform:"uppercase"}}>Importe</th>
            </tr>
          </thead>
          <tbody>
            {svs.map(sv=>(
              <tr key={sv.id} style={{borderBottom:"1px solid #fdf0f5"}}>
                <td style={{padding:"6px 0",fontSize:"0.85rem",color:"#3a1a2e"}}>{sv.nombre}</td>
                <td style={{padding:"6px 0",fontSize:"0.8rem",color:"#666",textAlign:"center"}}>{sv.iva||"21%"}</td>
                <td style={{padding:"6px 0",fontSize:"0.85rem",fontWeight:600,textAlign:"right"}}>{fmtM(sv.precio)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{background:"#fdf8fb",borderRadius:"7px",padding:"9px 11px",marginBottom:"11px",fontSize:"0.78rem"}}>
          {Object.values(ivaG).map(g=>(
            <div key={g.k} style={{display:"flex",justifyContent:"space-between",color:"#666",marginBottom:"2px"}}>
