              <span>Base imponible ({g.k}):</span><span>{fmtM(g.base)}</span>
              <span style={{marginLeft:"8px"}}>IVA:</span><span>{fmtM(g.cuota)}</span>
            </div>
          ))}
        </div>
        <div style={{borderTop:"2px solid #c9527a",paddingTop:"9px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:"0.77rem",color:"#666"}}>Pago: {metPago}</div>
          <div style={{fontSize:"1.25rem",fontWeight:800,color:"#c9527a",fontFamily:"Cormorant Garamond,serif"}}>TOTAL: {fmtM(subtotal)}</div>
        </div>
        {modo==="factura"&&<div style={{marginTop:"12px",padding:"5px",background:"#f0f8ff",borderRadius:"6px",fontSize:"0.7rem",color:"#666",textAlign:"center"}}>
          Star Wappas · Antonia Villalba Gil · DNI 38498971-F · Preparado para Verifactú 2027
        </div>}
        <div style={{textAlign:"center",marginTop:"12px",fontSize:"0.79rem",color:"#c9527a",fontStyle:"italic"}}>¡Gracias por tu visita! 💆‍♀️</div>
      </div>
    );
  };

  return(
    <div>
      <div style={{display:"flex",gap:"10px",marginBottom:"16px"}}>
        <input value={busq} onChange={e=>setBusq(e.target.value)} placeholder="🔍 Clienta o fecha..." style={{...inp,maxWidth:"280px",flex:1}}/>
      </div>
      <div style={{background:"white",borderRadius:"12px",overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr style={{background:"#fdf0f5"}}>{["Fecha","Clienta","Servicios","Empleada","Total","Pago","Doc."].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",fontSize:"0.7rem",fontWeight:700,color:"#9a6a8a",textTransform:"uppercase",letterSpacing:"0.04em"}}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={7} style={{padding:"35px",textAlign:"center",color:"#ccc"}}>Sin citas cobradas aún</td></tr>}
            {filtered.map((c,i)=>{
              const cl=clientes.find(x=>x.id===c.clienteId);
              const svs=(c.serviciosIds||[]).map(id=>servicios.find(s=>s.id===id)?.nombre).filter(Boolean);
              return(
                <tr key={c.id} style={{borderTop:"1px solid #f5eaf0",background:i%2===0?"white":"#fdf8fb"}}>
                  <td style={{padding:"8px 12px",fontSize:"0.84rem"}}>{fmt(c.fecha)}</td>
                  <td style={{padding:"8px 12px",fontWeight:600,color:"#3a1a2e",fontSize:"0.86rem"}}>{cl?.nombre||"—"}</td>
                  <td style={{padding:"8px 12px",fontSize:"0.81rem",color:"#555"}}>{svs.join(", ")||"—"}</td>
                  <td style={{padding:"8px 12px",fontSize:"0.81rem",color:"#555"}}>{c.empleada}</td>
                  <td style={{padding:"8px 12px",fontWeight:700,color:"#c9527a",fontSize:"0.88rem"}}>{fmtM(c.total)}</td>
                  <td style={{padding:"8px 12px",fontSize:"0.79rem"}}><span style={{background:"#e8f5ee",color:"#2a7a4a",borderRadius:"5px",padding:"2px 7px"}}>{c.metodoPago}</span></td>
                  <td style={{padding:"8px 12px"}}>
                    <div style={{display:"flex",gap:"4px"}}>
                      <button onClick={()=>{abrir(c);setModo("ticket");}} style={{...btn("#f0e0ea","#3a1a2e"),padding:"3px 8px",fontSize:"0.72rem"}}>🧾</button>
                      <button onClick={()=>{abrir(c);setModo("factura");}} style={{...btn("#e8eeff","#2a3a8a"),padding:"3px 8px",fontSize:"0.72rem"}}>📄</button>
                      <button onClick={()=>{if(window.confirm("¿Cancelar este ticket? La cita pasará a pendiente de cobro.")){onCancelarTicket(c.id);}}} style={{...btn("#ffe0e0","#c03030"),padding:"3px 8px",fontSize:"0.72rem"}} title="Cancelar ticket">✕</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {ticketModal&&(
        <Modal title={modo==="factura"?"Factura":"Ticket"} onClose={()=>setTicketModal(null)} wide>
          <div style={{display:"flex",gap:"8px",marginBottom:"14px",flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",background:"#f5eaf0",borderRadius:"7px",padding:"2px"}}>
              {["ticket","factura"].map(m=>(
                <button key={m} onClick={()=>setModo(m)} style={{...btn(modo===m?"#c9527a":"transparent",modo===m?"#fff":"#9a6a8a"),borderRadius:"6px",padding:"5px 13px",textTransform:"capitalize"}}>{m==="ticket"?"🧾 Ticket":"📄 Factura"}</button>
              ))}
            </div>
            {modo==="factura"&&<input value={factNum} onChange={e=>setFactNum(e.target.value)} style={{...inp,width:"110px"}} placeholder="Nº factura"/>}
            <select value={metPago} onChange={e=>setMetPago(e.target.value)} style={{...inp,width:"120px"}}>{METODOS_PAGO.map(m=><option key={m}>{m}</option>)}</select>
            {modo==="factura"&&(
              <>
                <input value={factDni} onChange={e=>setFactDni(e.target.value)} style={{...inp,width:"120px"}} placeholder="DNI/NIF cliente"/>
                <textarea value={factDireccion} onChange={e=>setFactDireccion(e.target.value)} style={{...inp,flex:1,minWidth:"160px",height:"60px",resize:"vertical"}} placeholder={"Línea 1: Calle y número\nLínea 2: CP y ciudad\nLínea 3: Provincia"}/>
              </>
            )}
            <button onClick={()=>window.print()} style={{...btn("#2a7a4a"),marginLeft:"auto"}}>🖨️ Imprimir / PDF</button>
            {(()=>{
              const cl=clientes.find(x=>x.id===ticketModal.clienteId);
              const tel=normTel(cl?.telefono);
              const svs=(ticketModal.serviciosIds||[]).map(id=>servicios.find(s=>s.id===id)?.nombre).filter(Boolean);
              const msg=`Hola ${cl?.nombre?.split(" ")[0]||""}! 👋\n\nAdjunto tu ${modo==="factura"?"factura":"ticket"} de Star Wappas del ${fmt(ticketModal.fecha)}:\n\n${svs.map(s=>"· "+s).join("\n")}\n\nTotal: ${fmtM(ticketModal.total||0)}\nPago: ${metPago}\n\n¡Gracias por tu visita! 💆‍♀️✨`;
              return tel?(
                <button onClick={()=>window.open(`https://wa.me/34${tel}?text=${encodeURIComponent(msg)}`,"_blank")} style={{...btn("#25D366"),marginLeft:"4px"}}>💬 Enviar por WhatsApp</button>
              ):(
                <button onClick={()=>{navigator.clipboard?.writeText(msg);alert("Sin teléfono. Mensaje copiado al portapapeles.");}} style={{...btn("#25D366"),marginLeft:"4px"}}>💬 Copiar para WA</button>
              );
            })()}
          </div>
          <Doc cita={ticketModal}/>
        </Modal>
      )}
      <style>{`@media print{body *{visibility:hidden}#ticket-print,#ticket-print *{visibility:visible}#ticket-print{position:fixed;left:0;top:0;width:100%;background:white;padding:20px}}`}</style>
    </div>
  );
}

// ─── CAJA ────────────────────────────────────────────────────────────────────
function Caja({ingresos,gastos,clientes,onAddIngreso,onDeleteIngreso,onAddGasto,onDeleteGasto}){
  const [tab,setTab]=useState("ingresos");
  const [mes,setMes]=useState(today().slice(0,7));
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const ingMes=ingresos.filter(i=>i.fecha?.startsWith(mes));
  const gasMes=gastos.filter(g=>g.fecha?.startsWith(mes));
  const totalIng=ingMes.reduce((s,i)=>s+Number(i.importe||0),0);
  const totalGas=gasMes.reduce((s,g)=>s+Number(g.importe||0),0);
  function guardar(){
    if(!form.importe||!form.fecha) return;
    if(modal==="ingreso") onAddIngreso({...form,id:uid()});
    else onAddGasto({...form,id:uid()});
    setModal(null);
  }
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"12px",marginBottom:"20px"}}>
        {[["💰 Ingresos",totalIng,"#d4f0e0","#2a7a4a"],["💸 Gastos",totalGas,"#f0d4d4","#7a2a2a"],["📈 Beneficio",totalIng-totalGas,totalIng>=totalGas?"#d4e8f0":"#f0d4d4",totalIng>=totalGas?"#2a4a7a":"#7a2a2a"]].map(([l,v,bg,co])=>(
          <div key={l} style={{background:bg,borderRadius:"11px",padding:"16px",textAlign:"center"}}>
            <div style={{fontSize:"0.7rem",fontWeight:700,color:co,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"4px"}}>{l}</div>
            <div style={{fontSize:"1.45rem",fontWeight:800,color:co,fontFamily:"Cormorant Garamond,serif"}}>{fmtM(v)}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:"9px",marginBottom:"16px",flexWrap:"wrap",alignItems:"center"}}>
        <input type="month" value={mes} onChange={e=>setMes(e.target.value)} style={{...inp,width:"150px"}}/>
        <div style={{display:"flex",background:"#f5eaf0",borderRadius:"8px",padding:"2px"}}>
          {["ingresos","gastos"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{...btn(tab===t?"#c9527a":"transparent",tab===t?"#fff":"#9a6a8a"),borderRadius:"7px",padding:"6px 15px",textTransform:"capitalize"}}>{t}</button>
          ))}
        </div>
        <button onClick={()=>{setForm({fecha:today(),importe:"",metodoPago:"Tarjeta",clienteId:"",empleada:"",concepto:""});setModal("ingreso");}} style={btn("#2a7a4a")}>+ Ingreso</button>
        <button onClick={()=>{setForm({fecha:today(),importe:"",categoria:"Productos cosméticos",concepto:"",proveedor:"",notas:""});setModal("gasto");}} style={btn("#7a2a2a")}>+ Gasto</button>
      </div>
      <div style={{background:"white",borderRadius:"12px",overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:"#fdf0f5"}}>
              {(tab==="ingresos"?["Fecha","Cliente","Empleada","Importe","Método",""]
                :["Fecha","Concepto","Categoría","Importe",""]).map(h=>(
                <th key={h} style={{padding:"9px 12px",textAlign:"left",fontSize:"0.7rem",fontWeight:700,color:"#9a6a8a",textTransform:"uppercase",letterSpacing:"0.04em"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {tab==="ingresos"&&ingMes.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map((ing,i)=>(
              <tr key={ing.id} style={{borderTop:"1px solid #f5eaf0",background:i%2===0?"white":"#fdf8fb"}}>
                <td style={{padding:"8px 12px",fontSize:"0.84rem"}}>{fmt(ing.fecha)}</td>
                <td style={{padding:"8px 12px",fontWeight:600,fontSize:"0.86rem"}}>{clientes.find(c=>c.id===ing.clienteId)?.nombre||ing.concepto||"—"}</td>
                <td style={{padding:"8px 12px",fontSize:"0.83rem",color:"#555"}}>{ing.empleada||"—"}</td>
                <td style={{padding:"8px 12px",fontWeight:700,color:"#2a7a4a"}}>{fmtM(ing.importe)}</td>
                <td style={{padding:"8px 12px",fontSize:"0.79rem"}}><span style={{background:"#e8f5ee",color:"#2a7a4a",borderRadius:"5px",padding:"2px 7px"}}>{ing.metodoPago}</span></td>
                <td style={{padding:"8px 12px"}}><button onClick={()=>onDeleteIngreso(ing.id)} style={{...btn("#ffe0e0","#cc3030"),padding:"3px 8px",fontSize:"0.72rem"}}>✕</button></td>
              </tr>
            ))}
            {tab==="gastos"&&gasMes.sort((a,b)=>b.fecha.localeCompare(a.fecha)).map((g,i)=>(
              <tr key={g.id} style={{borderTop:"1px solid #f5eaf0",background:i%2===0?"white":"#fdf8fb"}}>
                <td style={{padding:"8px 12px",fontSize:"0.84rem"}}>{fmt(g.fecha)}</td>
                <td style={{padding:"8px 12px",fontWeight:600,fontSize:"0.86rem"}}>{g.concepto}</td>
                <td style={{padding:"8px 12px",fontSize:"0.83rem",color:"#555"}}>{g.categoria}</td>
                <td style={{padding:"8px 12px",fontWeight:700,color:"#7a2a2a"}}>{fmtM(g.importe)}</td>
                <td style={{padding:"8px 12px"}}><button onClick={()=>onDeleteGasto(g.id)} style={{...btn("#ffe0e0","#cc3030"),padding:"3px 8px",fontSize:"0.72rem"}}>✕</button></td>
              </tr>
            ))}
            {((tab==="ingresos"&&ingMes.length===0)||(tab==="gastos"&&gasMes.length===0))&&<tr><td colSpan={6} style={{padding:"35px",textAlign:"center",color:"#ccc"}}>Sin registros este mes</td></tr>}
          </tbody>
        </table>
      </div>
      {modal&&(
        <Modal title={modal==="ingreso"?"Nuevo Ingreso":"Nuevo Gasto"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Fecha" half><input type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})} style={inp}/></Field>
            <Field label="Importe (€)" half><input type="number" step="0.01" value={form.importe} onChange={e=>setForm({...form,importe:e.target.value})} style={inp}/></Field>
            {modal==="ingreso"?<>
              <Field label="Cliente" half><select value={form.clienteId} onChange={e=>setForm({...form,clienteId:e.target.value})} style={inp}><option value="">—</option>{clientes.sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select></Field>
              <Field label="Empleada" half><select value={form.empleada} onChange={e=>setForm({...form,empleada:e.target.value})} style={inp}><option value="">—</option>{STAFF.map(s=><option key={s}>{s}</option>)}</select></Field>
              <Field label="Método" half><select value={form.metodoPago} onChange={e=>setForm({...form,metodoPago:e.target.value})} style={inp}>{METODOS_PAGO.map(m=><option key={m}>{m}</option>)}</select></Field>
              <Field label="Concepto" half><input value={form.concepto||""} onChange={e=>setForm({...form,concepto:e.target.value})} style={inp}/></Field>
            </>:<>
              <Field label="Concepto"><input value={form.concepto} onChange={e=>setForm({...form,concepto:e.target.value})} style={inp}/></Field>
              <Field label="Categoría" half><select value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})} style={inp}>{CATEGORIAS_GASTO.map(c=><option key={c}>{c}</option>)}</select></Field>
              <Field label="Proveedor" half><input value={form.proveedor||""} onChange={e=>setForm({...form,proveedor:e.target.value})} style={inp}/></Field>
            </>}
          </div>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
            <button onClick={()=>setModal(null)} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
            <button onClick={guardar} style={btn()}>Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── BONOS / PACKS ──────────────────────────────────────────────────────────
function Bonos({bonos,clientes,onAdd,onEdit,onDelete,onAddCliente,onAddIngreso}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [search,setSearch]=useState("");
  const [confirmUso,setConfirmUso]=useState(null);
  const [clienteBusq,setClienteBusq]=useState("");
  const [clienteSugs,setClienteSugs]=useState([]);

  const filtered=bonos.filter(b=>{
    const c=clientes.find(cl=>cl.id===b.clienteId);
    const nombre=(c?.nombre||b.clienteNombre||"").toLowerCase();
    return nombre.includes(search.toLowerCase())||
      (b.nombreBono||"").toLowerCase().includes(search.toLowerCase());
  });

  function abrirNuevo(){
    setForm({clienteId:"",clienteNombre:"",nombreBono:"",sesionesTotal:"10",sesionesUsadas:"0",precio:"",metodoPago:"Efectivo",fechaCompra:today(),notas:"",historialUsos:[]});
    setClienteBusq(""); setClienteSugs([]);
    setModal("new");
  }
  function abrirEditar(b){
    const cl=clientes.find(c=>c.id===b.clienteId);
    setForm({...b});
    setClienteBusq(cl?.nombre||b.clienteNombre||"");
    setClienteSugs([]);
    setModal("edit");
  }

  function buscarCliente(txt){
    setClienteBusq(txt);
    setForm(f=>({...f,clienteNombre:txt,clienteId:""}));
    if(txt.length<2){setClienteSugs([]);return;}
    setClienteSugs(clientes.filter(c=>(c.nombre||"").toLowerCase().includes(txt.toLowerCase())).slice(0,8));
  }
  function seleccionarCliente(c){
    setClienteBusq(c.nombre);
    setForm(f=>({...f,clienteId:c.id,clienteNombre:c.nombre}));
    setClienteSugs([]);
  }

  function guardar(){
    if(!clienteBusq.trim()) return alert("Indica el nombre de la clienta");
    if(!form.nombreBono) return alert("Indica el nombre del pack");
    let clienteId=form.clienteId;
    let clienteNombre=clienteBusq.trim();
    // Si no se vinculó a clienta existente, crear clienta nueva
    if(!clienteId && clienteNombre){
      const nueva={id:uid(),nombre:clienteNombre,telefono:"",email:"",fechaNac:"",dni:"",direccion:"",alergias:"",tipoPiel:"",origen:"",observaciones:""};
      onAddCliente(nueva);
      clienteId=nueva.id;
    }
    const bono={...form,id:form.id||uid(),clienteId,clienteNombre,sesionesUsadas:form.sesionesUsadas||"0",historialUsos:form.historialUsos||[]};
    if(modal==="new"){
      onAdd(bono);
      // Registrar cobro en Caja si tiene precio
      if(bono.precio&&Number(bono.precio)>0){
        onAddIngreso({id:uid(),fecha:bono.fechaCompra||today(),importe:Number(bono.precio),metodoPago:bono.metodoPago||"Efectivo",clienteId,concepto:`Pack: ${bono.nombreBono}`,empleada:""});
      }
    } else {
      onEdit(bono);
    }
    setModal(null);
  }

  function usarSesion(b){
    const us=Number(b.sesionesUsadas||0);
    const historial=[...(b.historialUsos||[]),{fecha:today()}];
    onEdit({...b,sesionesUsadas:us+1,historialUsos:historial});
    setConfirmUso(null);
  }

  const activos=bonos.filter(b=>Number(b.sesionesUsadas||0)<Number(b.sesionesTotal||0)).length;
  const agotados=bonos.filter(b=>Number(b.sesionesUsadas||0)>=Number(b.sesionesTotal||0)).length;

  return(
    <div>
      <div style={{display:"flex",gap:"10px",marginBottom:"16px",flexWrap:"wrap",alignItems:"center"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar por nombre o tipo de pack..." style={{...inp,maxWidth:"300px",flex:1}}/>
        <span style={{fontSize:"0.8rem",color:"#9a6a8a"}}>{activos} activos · {agotados} agotados</span>
        <button onClick={abrirNuevo} style={btn()}>🎟️ Vender pack</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"13px"}}>
        {filtered.length===0&&<p style={{color:"#ccc",gridColumn:"1/-1",textAlign:"center",padding:"40px"}}>Sin packs registrados</p>}
        {filtered.map(b=>{
          const cl=clientes.find(c=>c.id===b.clienteId);
          const nombreCl=cl?.nombre||b.clienteNombre||"—";
          const us=Number(b.sesionesUsadas||0),tot=Number(b.sesionesTotal||0);
          const agot=us>=tot;
          const rest=tot-us;
          return(
            <div key={b.id} style={{background:"white",borderRadius:"13px",padding:"17px",boxShadow:"0 2px 10px rgba(0,0,0,0.06)",border:`2px solid ${agot?"#f0d0d0":"#f0eaff"}`,opacity:agot?0.75:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,color:"#3a1a2e",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:"0.95rem"}}>{nombreCl}</div>
                  <div style={{fontSize:"0.82rem",color:"#7a2a9a",fontWeight:600,marginTop:"2px"}}>{b.nombreBono||"Pack"}</div>
                  <div style={{fontSize:"0.71rem",color:"#bbb",marginTop:"1px"}}>Comprado: {fmt(b.fechaCompra)} · {b.precio?fmtM(b.precio):""}</div>
                </div>
                {agot
                  ?<span style={{background:"#f0d0d0",color:"#9a2a2a",borderRadius:"6px",padding:"2px 8px",fontSize:"0.68rem",fontWeight:700,flexShrink:0,marginLeft:"8px"}}>AGOTADO</span>
                  :<span style={{background:"#e8d0f0",color:"#7a2a9a",borderRadius:"6px",padding:"3px 9px",fontSize:"0.75rem",fontWeight:700,flexShrink:0,marginLeft:"8px"}}>{rest} /{tot}</span>
                }
              </div>
              <div style={{background:"#f5eaf0",borderRadius:"6px",height:"8px",marginBottom:"8px"}}>
                <div style={{background:agot?"#cc3030":"#9a52c9",borderRadius:"6px",height:"8px",width:`${tot>0?(us/tot*100):0}%`,transition:"width 0.4s"}}/>
              </div>
              {(b.historialUsos||[]).length>0&&(
                <div style={{fontSize:"0.7rem",color:"#aaa",marginBottom:"9px",background:"#fdf8fb",borderRadius:"6px",padding:"6px 9px",maxHeight:"70px",overflowY:"auto"}}>
                  {(b.historialUsos||[]).map((h,i)=>(
                    <div key={i} style={{marginBottom:"1px"}}>· {fmt(h.fecha)} — sesión {i+1}</div>
                  ))}
                </div>
              )}
              <div style={{display:"flex",gap:"5px"}}>
                {!agot&&<button onClick={()=>setConfirmUso(b)} style={{...btn("#7a2a9a"),padding:"6px 10px",fontSize:"0.74rem",flex:1}}>✓ Usar sesión hoy</button>}
                <button onClick={()=>abrirEditar(b)} style={{...btn("#f0e0ea","#3a1a2e"),padding:"6px 9px",fontSize:"0.74rem"}}>✏️</button>
                <button onClick={()=>onDelete(b.id)} style={{...btn("#ffe0e0","#cc3030"),padding:"6px 9px",fontSize:"0.74rem"}}>✕</button>
              </div>
            </div>
          );
        })}
      </div>

      {/* Confirmación uso */}
      {confirmUso&&(()=>{
        const cl=clientes.find(c=>c.id===confirmUso.clienteId);
        const nombreCl=cl?.nombre||confirmUso.clienteNombre||"—";
        const us=Number(confirmUso.sesionesUsadas||0);
        const tot=Number(confirmUso.sesionesTotal||0);
        return(
          <Modal title="✓ Confirmar uso de sesión" onClose={()=>setConfirmUso(null)}>
            <div style={{textAlign:"center",padding:"12px 0 20px"}}>
              <div style={{fontSize:"2.2rem",marginBottom:"10px"}}>🎟️</div>
              <div style={{fontWeight:700,fontSize:"1.1rem",color:"#3a1a2e",marginBottom:"3px"}}>{nombreCl}</div>
              <div style={{color:"#7a2a9a",fontWeight:600,marginBottom:"18px"}}>{confirmUso.nombreBono||"Pack"}</div>
              <div style={{background:"#f5eaff",borderRadius:"12px",padding:"16px",marginBottom:"14px"}}>
                <div style={{fontSize:"1.3rem",fontWeight:800,color:"#7a2a9a"}}>Sesión {us+1} de {tot}</div>
                <div style={{color:"#aaa",marginTop:"5px",fontSize:"0.85rem"}}>Quedarán <strong>{tot-us-1}</strong> sesiones</div>
              </div>
              <div style={{fontSize:"0.82rem",color:"#888"}}>📅 {fmt(today())}</div>
            </div>
            <div style={{display:"flex",gap:"10px",justifyContent:"center"}}>
              <button onClick={()=>setConfirmUso(null)} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
              <button onClick={()=>usarSesion(confirmUso)} style={btn("#7a2a9a")}>✓ Confirmar</button>
            </div>
          </Modal>
        );
      })()}

      {/* Modal vender/editar pack */}
      {modal&&(
        <Modal title={modal==="new"?"🎟️ Vender Pack de Sesiones":"✏️ Editar Pack"} onClose={()=>setModal(null)} wide>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Clienta">
              <div style={{position:"relative"}}>
                <input value={clienteBusq} onChange={e=>buscarCliente(e.target.value)}
                  placeholder="Escribe nombre para buscar o crear nueva..."
                  style={inp} autoComplete="off"/>
                {clienteSugs.length>0&&(
                  <div style={{position:"absolute",top:"calc(100% + 3px)",left:0,right:0,background:"white",border:"1.5px solid #e8d5e0",borderRadius:"9px",boxShadow:"0 8px 24px rgba(0,0,0,0.14)",zIndex:999,maxHeight:"220px",overflowY:"auto"}}>
                    {clienteSugs.map(c=>(
                      <div key={c.id} onMouseDown={()=>seleccionarCliente(c)}
                        style={{padding:"9px 13px",cursor:"pointer",fontSize:"0.86rem",borderBottom:"1px solid #fdf0f5"}}
                        onMouseEnter={e=>e.currentTarget.style.background="#fdf0f5"}
                        onMouseLeave={e=>e.currentTarget.style.background="white"}>
                        <span style={{fontWeight:600,color:"#3a1a2e"}}>{c.nombre}</span>
                        {c.telefono&&<span style={{color:"#aaa",marginLeft:"8px",fontSize:"0.78rem"}}>{c.telefono}</span>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
              {form.clienteId&&<div style={{fontSize:"0.72rem",color:"#2a7a4a",marginTop:"3px",fontWeight:600}}>✓ Clienta existente seleccionada</div>}
              {!form.clienteId&&clienteBusq.length>1&&<div style={{fontSize:"0.72rem",color:"#c9527a",marginTop:"3px",fontWeight:600}}>⚠️ Clienta nueva — se creará automáticamente al guardar</div>}
            </Field>

            <Field label="Nombre del pack">
              <input value={form.nombreBono||""} onChange={e=>setForm({...form,nombreBono:e.target.value})}
                placeholder="Ej: Pack 10 sesiones láser, Bono facial mensual..." style={inp}/>
            </Field>

            <Field label="Nº de sesiones" third>
              <input type="number" min="1" value={form.sesionesTotal||""} onChange={e=>setForm({...form,sesionesTotal:e.target.value})} style={inp}/>
            </Field>
            <Field label="Sesiones usadas" third>
              <input type="number" min="0" value={form.sesionesUsadas||"0"} onChange={e=>setForm({...form,sesionesUsadas:e.target.value})} style={inp}/>
            </Field>
            <Field label="Fecha compra" third>
              <input type="date" value={form.fechaCompra||today()} onChange={e=>setForm({...form,fechaCompra:e.target.value})} style={inp}/>
            </Field>

            <Field label="Precio del pack (€)" half>
              <input type="number" step="0.01" value={form.precio||""} onChange={e=>setForm({...form,precio:e.target.value})} style={inp}/>
            </Field>
            <Field label="Forma de pago" half>
              <select value={form.metodoPago||"Efectivo"} onChange={e=>setForm({...form,metodoPago:e.target.value})} style={inp}>
                {METODOS_PAGO.map(m=><option key={m}>{m}</option>)}
              </select>
            </Field>

            {modal==="new"&&form.precio&&Number(form.precio)>0&&(
              <div style={{width:"100%",background:"#d4f0e0",borderRadius:"9px",padding:"10px 14px",fontSize:"0.83rem",color:"#2a7a4a",fontWeight:600}}>
                ✅ Se registrará automáticamente en Caja: {fmtM(Number(form.precio))} · {form.metodoPago||"Efectivo"}
              </div>
            )}

            <Field label="Notas">
              <textarea value={form.notas||""} onChange={e=>setForm({...form,notas:e.target.value})}
                style={{...inp,height:"55px",resize:"vertical"}} placeholder="Tratamiento, condiciones, observaciones..."/>
            </Field>
          </div>
          <Actions onSave={guardar} onDelete={()=>{onDelete(form.id);setModal(null);}} onCancel={()=>setModal(null)} isNew={modal==="new"}/>
        </Modal>
      )}
    </div>
  );
}

// ─── STOCK ───────────────────────────────────────────────────────────────────
function Stock({productos,ventas,onAdd,onEdit,onDelete,onAddVenta}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [search,setSearch]=useState("");
  const [tabStock,setTabStock]=useState("productos");
  const [ventaForm,setVentaForm]=useState({fecha:today(),productoId:"",cantidad:"1",metodoPago:"Efectivo",clienteId:""});
  const [ventaModal,setVentaModal]=useState(false);
  const filtered=productos.filter(p=>(p.nombre||"").toLowerCase().includes(search.toLowerCase()));
  const bajo=productos.filter(p=>Number(p.stock||0)<=Number(p.stockMin||0));
  function guardar(){if(!form.nombre) return; if(modal==="new") onAdd({...form,id:uid()}); else onEdit({...form}); setModal(null);}
  function guardarVenta(){
    if(!ventaForm.productoId||!ventaForm.cantidad) return;
    const p=productos.find(x=>x.id===ventaForm.productoId);
    if(!p) return;
    const cant=Number(ventaForm.cantidad);
    const precioVenta=Number(p.precioVenta||p.precio||0);
    onAddVenta({...ventaForm,id:uid(),importe:precioVenta*cant,nombreProducto:p.nombre});
    onEdit({...p,stock:Math.max(0,Number(p.stock||0)-cant)});
    setVentaModal(false);
    setVentaForm({fecha:today(),productoId:"",cantidad:"1",metodoPago:"Efectivo",clienteId:""});
  }
  return(
    <div>
      {bajo.length>0&&<div style={{background:"#fff5e0",border:"1.5px solid #f0c060",borderRadius:"9px",padding:"11px 15px",marginBottom:"16px",fontSize:"0.84rem"}}>⚠️ <strong>Stock bajo:</strong> {bajo.map(p=>p.nombre).join(", ")}</div>}
      <div style={{display:"flex",gap:"9px",marginBottom:"16px",flexWrap:"wrap",alignItems:"center"}}>
        <div style={{display:"flex",background:"#f5eaf0",borderRadius:"8px",padding:"2px"}}>
          {["productos","ventas"].map(t=>(
            <button key={t} onClick={()=>setTabStock(t)} style={{...btn(tabStock===t?"#c9527a":"transparent",tabStock===t?"#fff":"#9a6a8a"),borderRadius:"7px",padding:"6px 15px",textTransform:"capitalize"}}>{t==="productos"?"📦 Productos":"💳 Ventas"}</button>
          ))}
        </div>
        {tabStock==="productos"&&<>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar..." style={{...inp,maxWidth:"220px",flex:1}}/>
          <button onClick={()=>{setForm({nombre:"",categoria:"",marca:"",stock:"",stockMin:"5",unidad:"unidades",precioCompra:"",precioVenta:"",proveedor:""});setModal("new");}} style={btn()}>+ Añadir producto</button>
        </>}
        {tabStock==="ventas"&&<button onClick={()=>setVentaModal(true)} style={btn("#7a2a9a")}>+ Registrar venta</button>}
      </div>

      {tabStock==="productos"&&(
        <div style={{background:"white",borderRadius:"12px",overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr style={{background:"#fdf0f5"}}>{["Producto","Marca","Stock","Mín","P. Compra","P. Venta","Beneficio",""].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",fontSize:"0.7rem",fontWeight:700,color:"#9a6a8a",textTransform:"uppercase"}}>{h}</th>)}</tr></thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={7} style={{padding:"35px",textAlign:"center",color:"#ccc"}}>Sin productos</td></tr>}
              {filtered.map((p,i)=>{
                const b=Number(p.stock||0)<=Number(p.stockMin||0);
                return(
                  <tr key={p.id} style={{borderTop:"1px solid #f5eaf0",background:b?"#fff8f0":i%2===0?"white":"#fdf8fb"}}>
                    <td style={{padding:"8px 12px",fontWeight:600,color:"#3a1a2e",fontSize:"0.87rem"}}>{p.nombre}</td>
                    <td style={{padding:"8px 12px",fontSize:"0.83rem",color:"#555"}}>{p.marca||"—"}</td>
                    <td style={{padding:"8px 12px"}}><span style={{background:b?"#ffe0c0":Number(p.stock)>10?"#d4f0e0":"#e0f0ff",color:b?"#c05000":Number(p.stock)>10?"#2a7a4a":"#2a4a7a",borderRadius:"6px",padding:"2px 8px",fontSize:"0.82rem",fontWeight:700}}>{p.stock||0} {p.unidad}</span></td>
                    <td style={{padding:"8px 12px",fontSize:"0.81rem",color:"#999"}}>{p.stockMin||0}</td>
                    <td style={{padding:"8px 12px",fontSize:"0.83rem",color:"#7a9a7a"}}>{p.precioCompra?fmtM(p.precioCompra):"—"}</td>
                    <td style={{padding:"8px 12px",fontSize:"0.83rem",fontWeight:600,color:"#c9527a"}}>{p.precioVenta?fmtM(p.precioVenta):p.precio?fmtM(p.precio):"—"}</td>
                    <td style={{padding:"8px 12px",fontSize:"0.83rem",fontWeight:700,color:(Number(p.precioVenta||p.precio||0)-Number(p.precioCompra||0))>0?"#2a7a4a":"#aaa"}}>
                      {p.precioCompra&&(p.precioVenta||p.precio)?fmtM(Number(p.precioVenta||p.precio||0)-Number(p.precioCompra||0)):"—"}
                    </td>
                    <td style={{padding:"8px 12px"}}><div style={{display:"flex",gap:"4px"}}><button onClick={()=>{setForm({...p});setModal("edit");}} style={{...btn("#f0e0ea","#3a1a2e"),padding:"3px 8px",fontSize:"0.72rem"}}>✏️</button><button onClick={()=>onDelete(p.id)} style={{...btn("#ffe0e0","#cc3030"),padding:"3px 8px",fontSize:"0.72rem"}}>✕</button></div></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {tabStock==="ventas"&&(
        <div style={{background:"white",borderRadius:"12px",overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr style={{background:"#fdf0f5"}}>{["Fecha","Producto","Cantidad","Importe","Pago"].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",fontSize:"0.7rem",fontWeight:700,color:"#9a6a8a",textTransform:"uppercase"}}>{h}</th>)}</tr></thead>
            <tbody>
              {(ventas||[]).length===0&&<tr><td colSpan={5} style={{padding:"35px",textAlign:"center",color:"#ccc"}}>Sin ventas registradas</td></tr>}
              {(ventas||[]).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map((v,i)=>(
                <tr key={v.id} style={{borderTop:"1px solid #f5eaf0",background:i%2===0?"white":"#fdf8fb"}}>
                  <td style={{padding:"8px 12px",fontSize:"0.84rem"}}>{fmt(v.fecha)}</td>
                  <td style={{padding:"8px 12px",fontWeight:600,fontSize:"0.86rem"}}>{v.nombreProducto||"—"}</td>
                  <td style={{padding:"8px 12px",fontSize:"0.83rem"}}>{v.cantidad}</td>
                  <td style={{padding:"8px 12px",fontWeight:700,color:"#c9527a"}}>{fmtM(v.importe)}</td>
                  <td style={{padding:"8px 12px"}}><span style={{background:"#e8f5ee",color:"#2a7a4a",borderRadius:"5px",padding:"2px 7px",fontSize:"0.79rem"}}>{v.metodoPago}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {ventaModal&&(
        <Modal title="💳 Registrar Venta de Producto" onClose={()=>setVentaModal(false)}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Producto">
              <select value={ventaForm.productoId} onChange={e=>setVentaForm({...ventaForm,productoId:e.target.value})} style={inp}>
                <option value="">— Seleccionar producto</option>
                {productos.filter(p=>Number(p.stock||0)>0).map(p=>(
                  <option key={p.id} value={p.id}>{p.nombre} (stock: {p.stock}) — {fmtM(p.precioVenta||p.precio||0)}/ud</option>
                ))}
              </select>
            </Field>
            <Field label="Cantidad" half><input type="number" min="1" value={ventaForm.cantidad} onChange={e=>setVentaForm({...ventaForm,cantidad:e.target.value})} style={inp}/></Field>
            <Field label="Método de pago" half><select value={ventaForm.metodoPago} onChange={e=>setVentaForm({...ventaForm,metodoPago:e.target.value})} style={inp}>{METODOS_PAGO.map(m=><option key={m}>{m}</option>)}</select></Field>
            <Field label="Fecha" half><input type="date" value={ventaForm.fecha} onChange={e=>setVentaForm({...ventaForm,fecha:e.target.value})} style={inp}/></Field>
            {ventaForm.productoId&&(()=>{
              const p=productos.find(x=>x.id===ventaForm.productoId);
              const total=Number(p?.precioVenta||p?.precio||0)*Number(ventaForm.cantidad||1);
              return <div style={{background:"#f5eaf0",borderRadius:"8px",padding:"9px 12px",fontSize:"0.86rem",fontWeight:700,color:"#c9527a",width:"100%"}}>Total: {fmtM(total)} · Stock restante: {Number(p?.stock||0)-Number(ventaForm.cantidad||1)}</div>;
            })()}
          </div>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"14px"}}>
            <button onClick={()=>setVentaModal(false)} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
            <button onClick={guardarVenta} style={btn()}>💾 Registrar venta</button>
          </div>
        </Modal>
      )}

      {modal&&(
        <Modal title={modal==="new"?"Nuevo Producto":"Editar Producto"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Nombre"><input value={form.nombre||""} onChange={e=>setForm({...form,nombre:e.target.value})} style={inp}/></Field>
            <Field label="Marca" half><input value={form.marca||""} onChange={e=>setForm({...form,marca:e.target.value})} style={inp}/></Field>
            <Field label="Categoría" half><input value={form.categoria||""} onChange={e=>setForm({...form,categoria:e.target.value})} style={inp}/></Field>
            <Field label="Stock actual" half><input type="number" value={form.stock||""} onChange={e=>setForm({...form,stock:e.target.value})} style={inp}/></Field>
            <Field label="Stock mínimo" half><input type="number" value={form.stockMin||""} onChange={e=>setForm({...form,stockMin:e.target.value})} style={inp}/></Field>
            <Field label="Unidad" half><input value={form.unidad||""} onChange={e=>setForm({...form,unidad:e.target.value})} style={inp} placeholder="unidades, ml..."/></Field>
            <Field label="Precio compra (€)" half><input type="number" step="0.01" value={form.precioCompra||""} onChange={e=>setForm({...form,precioCompra:e.target.value})} style={inp}/></Field>
            <Field label="Precio venta (€)" half><input type="number" step="0.01" value={form.precioVenta||form.precio||""} onChange={e=>setForm({...form,precioVenta:e.target.value,precio:e.target.value})} style={inp}/></Field>
            <Field label="Proveedor"><input value={form.proveedor||""} onChange={e=>setForm({...form,proveedor:e.target.value})} style={inp}/></Field>
          </div>
          <Actions onSave={guardar} onDelete={()=>{onDelete(form.id);setModal(null);}} onCancel={()=>setModal(null)} isNew={modal==="new"}/>
        </Modal>
      )}
    </div>
  );
}

// ─── TARJETAS DE REGALO ──────────────────────────────────────────────────────
function TarjetasRegalo({tarjetas,clientes,onAdd,onEdit,onDelete}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [search,setSearch]=useState("");
  const [verUsadas,setVerUsadas]=useState(false);

  const activas=tarjetas.filter(t=>t.activa&&Number(t.saldo||0)>0);
  const agotadas=tarjetas.filter(t=>!t.activa||Number(t.saldo||0)<=0);
  const mostrar=verUsadas?agotadas:activas;
  const filtradas=mostrar.filter(t=>{
    const cl=clientes.find(c=>c.id===t.clienteId);
    const txt=(t.codigo||"")+" "+(cl?.nombre||"")+" "+(t.beneficiario||"");
    return txt.toLowerCase().includes(search.toLowerCase());
  });

  function nueva(){
    setForm({codigo:generarCodigoTarjeta(),valor:"",saldo:"",clienteId:"",beneficiario:"",fechaCreacion:today(),activa:true,historial:[]});
    setModal("new");
  }
  function guardar(){
    if(!form.valor||Number(form.valor)<=0) return;
    const f={...form,valor:Number(form.valor),saldo:modal==="new"?Number(form.valor):Number(form.saldo)};
    if(modal==="new") onAdd({...f,id:uid()});
    else onEdit(f);
    setModal(null);
  }
  function usarSaldo(t,importe){
    const imp=Number(importe);
    if(isNaN(imp)||imp<=0||imp>Number(t.saldo||0)) return;
    const hist=[...(t.historial||[]),{fecha:today(),importe:imp,concepto:"Uso en cita"}];
    const nuevoSaldo=Number(t.saldo||0)-imp;
    onEdit({...t,saldo:nuevoSaldo,activa:nuevoSaldo>0,historial:hist});
  }

  const [usoModal,setUsoModal]=useState(null);
  const [usoImporte,setUsoImporte]=useState("");

  return(
    <div>
      <div style={{display:"flex",gap:"10px",marginBottom:"16px",flexWrap:"wrap",alignItems:"center"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar por código o nombre..." style={{...inp,maxWidth:"280px",flex:1}}/>
        <button onClick={nueva} style={btn()}>🎁 Nueva tarjeta</button>
        <div style={{display:"flex",background:"#f0e0ea",borderRadius:"8px",overflow:"hidden"}}>
          <button onClick={()=>setVerUsadas(false)} style={{...btn(verUsadas?"#f0e0ea":"#c9527a",verUsadas?"#9a6a8a":"#fff"),borderRadius:0,padding:"5px 12px",fontSize:"0.78rem"}}>Activas ({activas.length})</button>
          <button onClick={()=>setVerUsadas(true)} style={{...btn(!verUsadas?"#f0e0ea":"#c9527a",!verUsadas?"#9a6a8a":"#fff"),borderRadius:0,padding:"5px 12px",fontSize:"0.78rem"}}>Agotadas ({agotadas.length})</button>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:"12px"}}>
        {filtradas.map(t=>{
          const cl=clientes.find(c=>c.id===t.clienteId);
          const pct=Number(t.valor||1)>0?Math.min(100,Number(t.saldo||0)/Number(t.valor||1)*100):0;
          const agot=Number(t.saldo||0)<=0;
          return(
            <div key={t.id} style={{background:"white",borderRadius:"13px",padding:"16px",boxShadow:"0 2px 10px rgba(0,0,0,0.06)",border:`2px solid ${agot?"#f0e0e0":"#f0e0ea"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}}>
                <div>
                  <div style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.1rem",fontWeight:700,color:"#3a1a2e",letterSpacing:"0.05em"}}>{t.codigo}</div>
                  <div style={{fontSize:"0.76rem",color:"#9a6a8a",marginTop:"2px"}}>Creada: {fmt(t.fechaCreacion)}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:"1.2rem",fontWeight:800,color:agot?"#cc3030":"#2a7a4a",fontFamily:"Cormorant Garamond,serif"}}>{fmtM(t.saldo||0)}</div>
                  <div style={{fontSize:"0.7rem",color:"#9a6a8a"}}>de {fmtM(t.valor||0)}</div>
                </div>
              </div>
              <div style={{background:"#f0e0ea",borderRadius:"4px",height:"5px",marginBottom:"10px"}}>
                <div style={{background:agot?"#cc3030":"#c9527a",borderRadius:"4px",height:"5px",width:`${pct}%`,transition:"width 0.3s"}}/>
              </div>
              {(cl||t.beneficiario)&&(
                <div style={{fontSize:"0.78rem",color:"#555",marginBottom:"8px"}}>
                  {cl&&<span>👤 {cl.nombre}</span>}
                  {t.beneficiario&&<span style={{marginLeft:"8px",color:"#9a6a8a"}}>· Para: {t.beneficiario}</span>}
                </div>
              )}
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                {!agot&&<button onClick={()=>{setUsoModal(t);setUsoImporte("");}} style={{...btn("#25D366"),padding:"4px 10px",fontSize:"0.76rem"}}>💳 Usar saldo</button>}
                <button onClick={()=>{setForm({...t});setModal("edit");}} style={{...btn("#f0e0ea","#3a1a2e"),padding:"4px 9px",fontSize:"0.73rem"}}>✏️</button>
                {t.historial?.length>0&&(
                  <button onClick={()=>alert(t.historial.map(h=>`${fmt(h.fecha)}: -${fmtM(h.importe)} · ${h.concepto||""}`).join("\n"))} style={{...btn("#f0f0ff","#555"),padding:"4px 9px",fontSize:"0.73rem"}}>📋 Historial</button>
                )}
              </div>
            </div>
          );
        })}
        {filtradas.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:"40px",color:"#ccc"}}>Sin tarjetas — crea la primera con el botón de arriba</div>}
      </div>

      {/* Modal nueva/editar */}
      {(modal==="new"||modal==="edit")&&(
        <Modal title={modal==="new"?"🎁 Nueva Tarjeta de Regalo":"Editar Tarjeta"} onClose={()=>setModal(null)}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
            <Field label="Código">
              <div style={{display:"flex",gap:"6px"}}>
                <input value={form.codigo||""} onChange={e=>setForm({...form,codigo:e.target.value})} style={{...inp,flex:1}} placeholder="TG-XXXX-XXXX"/>
                {modal==="new"&&<button onClick={()=>setForm({...form,codigo:generarCodigoTarjeta()})} style={{...btn("#f0e0ea","#3a1a2e"),padding:"7px 10px",fontSize:"0.78rem",flexShrink:0}}>🔄</button>}
              </div>
            </Field>
            <Field label="Valor inicial (€)" half><input type="number" step="0.01" value={form.valor||""} onChange={e=>setForm({...form,valor:e.target.value})} style={inp} placeholder="50.00"/></Field>
            {modal==="edit"&&<Field label="Saldo actual (€)" half><input type="number" step="0.01" value={form.saldo||""} onChange={e=>setForm({...form,saldo:e.target.value})} style={inp}/></Field>}
            <Field label="Para (nombre del beneficiario)" half><input value={form.beneficiario||""} onChange={e=>setForm({...form,beneficiario:e.target.value})} style={inp} placeholder="Ej: Para María"/></Field>
            <Field label="Clienta en el sistema" half>
              <select value={form.clienteId||""} onChange={e=>setForm({...form,clienteId:e.target.value})} style={inp}>
                <option value="">— Sin asignar —</option>
                {clientes.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
              </select>
            </Field>
          </div>
          <Actions onSave={guardar} onDelete={()=>{if(window.confirm("¿Eliminar esta tarjeta?"))onDelete(form.id);setModal(null);}} onCancel={()=>setModal(null)} isNew={modal==="new"}/>
        </Modal>
      )}

      {/* Modal usar saldo */}
      {usoModal&&(
        <Modal title={`💳 Usar saldo — ${usoModal.codigo}`} onClose={()=>setUsoModal(null)}>
          <div style={{background:"#f0fff0",borderRadius:"9px",padding:"12px 15px",marginBottom:"14px"}}>
            <div style={{fontSize:"0.83rem",color:"#555"}}>Saldo disponible: <strong style={{color:"#2a7a4a",fontSize:"1rem"}}>{fmtM(usoModal.saldo||0)}</strong></div>
          </div>
          <Field label="Importe a descontar (€)">
            <input type="number" step="0.01" value={usoImporte} onChange={e=>setUsoImporte(e.target.value)} style={inp} placeholder="0.00" max={usoModal.saldo||0} autoFocus/>
          </Field>
          {Number(usoImporte)>Number(usoModal.saldo||0)&&<div style={{background:"#ffe0e0",borderRadius:"7px",padding:"8px 12px",fontSize:"0.82rem",color:"#c03030",marginTop:"6px"}}>⚠️ El importe supera el saldo disponible</div>}
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"12px"}}>
            <button onClick={()=>setUsoModal(null)} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
            <button onClick={()=>{usarSaldo(usoModal,usoImporte);setUsoModal(null);}} disabled={!usoImporte||Number(usoImporte)<=0||Number(usoImporte)>Number(usoModal.saldo||0)} style={btn("#2a7a4a")}>✅ Descontar {usoImporte?fmtM(usoImporte):""}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── ESTADÍSTICAS ────────────────────────────────────────────────────────────
function Estadisticas({citas,ingresos,gastos,clientes,servicios}){
  const [mes,setMes]=useState(today().slice(0,7));
  const ingMes=ingresos.filter(i=>i.fecha?.startsWith(mes));
  const gasMes=gastos.filter(g=>g.fecha?.startsWith(mes));
  const citasMes=citas.filter(c=>c.fecha?.startsWith(mes));
  const totalIng=ingMes.reduce((s,i)=>s+Number(i.importe||0),0);
  const totalGas=gasMes.reduce((s,g)=>s+Number(g.importe||0),0);
  const cobradas=citasMes.filter(c=>c.cobrado);
  const ticket=cobradas.length>0?cobradas.reduce((s,c)=>s+Number(c.total||0),0)/cobradas.length:0;
  const svC={};citasMes.forEach(c=>(c.serviciosIds||[]).forEach(id=>{const sv=servicios.find(s=>s.id===id);if(sv)svC[sv.nombre]=(svC[sv.nombre]||0)+1;}));
  const topSv=Object.entries(svC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const empC={};citasMes.forEach(c=>{empC[c.empleada]=(empC[c.empleada]||0)+1;});
  const clC={};citasMes.forEach(c=>{clC[c.clienteId]=(clC[c.clienteId]||0)+1;});
  const topCl=Object.entries(clC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const Barra=({label,val,max,color="#c9527a",vd})=>(
    <div style={{marginBottom:"6px"}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.81rem",marginBottom:"2px"}}>
        <span style={{color:"#3a1a2e",fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginRight:"8px"}}>{label}</span>
        <span style={{color:"#9a6a8a",fontWeight:700,flexShrink:0}}>{vd||val}</span>
      </div>
      <div style={{background:"#f0e0ea",borderRadius:"4px",height:"5px"}}>
        <div style={{background:color,borderRadius:"4px",height:"5px",width:`${max>0?(val/max*100):0}%`}}/>
      </div>
    </div>
  );
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"18px"}}>
        <input type="month" value={mes} onChange={e=>setMes(e.target.value)} style={{...inp,width:"150px"}}/>
        <span style={{color:"#9a6a8a",fontSize:"0.87rem"}}>{new Date(mes+"-01").toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:"11px",marginBottom:"22px"}}>
        {[["🗓️","Citas",citasMes.length,"#e8d0f0","#7a2a9a"],["✅","Cobradas",cobradas.length,"#d0f0e0","#2a7a4a"],["👥","Clientas",new Set(citasMes.map(c=>c.clienteId)).size,"#d0e8f0","#2a6a9a"],["💰","Ingresos",fmtM(totalIng),"#d0f0e0","#2a7a4a"],["💸","Gastos",fmtM(totalGas),"#f0d0d0","#9a2a2a"],["🎯","Ticket medio",fmtM(ticket),"#f5e8d0","#9a6a2a"]].map(([ico,lab,val,bg,co])=>(
          <div key={lab} style={{background:bg,borderRadius:"9px",padding:"13px",textAlign:"center"}}>
            <div style={{fontSize:"1.1rem"}}>{ico}</div>
            <div style={{fontSize:"0.68rem",fontWeight:700,color:co,textTransform:"uppercase",letterSpacing:"0.05em",marginTop:"3px"}}>{lab}</div>
            <div style={{fontSize:"1.05rem",fontWeight:800,color:co,marginTop:"2px",fontFamily:"Cormorant Garamond,serif"}}>{val}</div>
          </div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
        <div style={{background:"white",borderRadius:"11px",padding:"16px",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
          <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.05rem",color:"#3a1a2e",marginBottom:"12px"}}>Servicios más solicitados</h3>
          {topSv.length===0?<p style={{color:"#ccc",fontSize:"0.83rem"}}>Sin datos</p>:topSv.map(([s,n])=><Barra key={s} label={s} val={n} max={topSv[0]?.[1]||1}/>)}
        </div>
        <div style={{background:"white",borderRadius:"11px",padding:"16px",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
          <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.05rem",color:"#3a1a2e",marginBottom:"12px"}}>Actividad por empleada</h3>
          {Object.entries(empC).length===0?<p style={{color:"#ccc",fontSize:"0.83rem"}}>Sin datos</p>:Object.entries(empC).sort((a,b)=>b[1]-a[1]).map(([e,n])=><Barra key={e} label={e} val={n} max={Math.max(...Object.values(empC))} color={COLORS_STAFF[STAFF.indexOf(e)%COLORS_STAFF.length]}/>)}
        </div>
        <div style={{background:"white",borderRadius:"11px",padding:"16px",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
          <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.05rem",color:"#3a1a2e",marginBottom:"12px"}}>Clientas más frecuentes</h3>
          {topCl.length===0?<p style={{color:"#ccc",fontSize:"0.83rem"}}>Sin datos</p>:topCl.map(([id,n])=>{const c=clientes.find(x=>x.id===id);return<Barra key={id} label={c?.nombre||"?"} val={n} max={topCl[0]?.[1]||1} vd={`${n} visitas`} color="#9a6a8a"/>;}) }
        </div>
        <div style={{background:"white",borderRadius:"11px",padding:"16px",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
          <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.05rem",color:"#3a1a2e",marginBottom:"12px"}}>Resumen financiero</h3>
          {[["Ingresos del mes",totalIng,"#2a7a4a"],["Gastos del mes",totalGas,"#7a2a2a"],["Beneficio neto",totalIng-totalGas,totalIng>=totalGas?"#2a4a7a":"#7a2a2a"]].map(([l,v,co])=>(
            <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #f5eaf0",fontSize:"0.86rem"}}>
              <span style={{color:"#555"}}>{l}</span>
              <span style={{fontWeight:700,color:co}}>{fmtM(v)}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── RECORDATORIOS ───────────────────────────────────────────────────────────
function Recordatorios({citas,clientes,config}){
  const manStr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().split("T")[0];})();
  const centro=config.nombreEmpresa||"Star Wappas";
  const [colaEnvio,setColaEnvio]=useState(null);
  const [enviados,setEnviados]=useState(new Set());
  const [otroDia,setOtroDia]=useState("");

  // Citas de hoy y mañana, pendientes de cobro
  const hoy=citas.filter(c=>c.fecha===today()&&!c.cobrado).sort((a,b)=>a.hora.localeCompare(b.hora));
  const man=citas.filter(c=>c.fecha===manStr&&!c.cobrado).sort((a,b)=>a.hora.localeCompare(b.hora));

  // Hora actual para detectar citas próximas (2-3h)
  const ahoraMin=(()=>{const n=new Date();return n.getHours()*60+n.getMinutes();})();
  const proximasDos=hoy.filter(c=>{
    const [h,m]=c.hora.split(":").map(Number);
    const diff=(h*60+m)-ahoraMin;
    return diff>=90&&diff<=210; // entre 1.5h y 3.5h
  });

  function msgRecordatorio(cita,cuando){
    const cl=clientes.find(c=>c.id===cita.clienteId);
    const nombre=cl?.nombre?.split(" ")[0]||"cliente";
    return `Hola ${nombre} 👋\n\nTe recordamos tu cita ${cuando} en ${centro} a las ${cita.hora}.\n\n¿Puedes confirmarnos asistencia? Si necesitas cambiarla avísanos con tiempo.\n\n¡Hasta pronto! 💆‍♀️✨`;
  }

  function enviarWa(cita,cuando){
    const cl=clientes.find(c=>c.id===cita.clienteId);
    const tel=normTel(cl?.telefono);
    const msg=msgRecordatorio(cita,cuando);
    if(tel) window.open(`https://wa.me/34${tel}?text=${encodeURIComponent(msg)}`,"_blank");
    else{navigator.clipboard?.writeText(msg);alert(`${cl?.nombre||"?"} no tiene teléfono. Mensaje copiado.`);}
  }

  function enviarTodos(lista,cuando){
    const conTel=lista.filter(c=>{const cl=clientes.find(x=>x.id===c.clienteId);return normTel(cl?.telefono);});
    const sinTel=lista.filter(c=>{const cl=clientes.find(x=>x.id===c.clienteId);return !normTel(cl?.telefono);});
    if(sinTel.length>0) alert(`⚠️ ${sinTel.length} cliente(s) sin teléfono no recibirán recordatorio.`);
    if(conTel.length===0) return;
    setColaEnvio({lista:conTel,cuando});
    setEnviados(new Set());
  }

  const Card=({cita,cuando,badge})=>{
    const cl=clientes.find(c=>c.id===cita.clienteId);
    return(
      <div style={{display:"flex",alignItems:"center",gap:"9px",padding:"9px 12px",background:"white",borderRadius:"9px",marginBottom:"6px",boxShadow:"0 1px 5px rgba(0,0,0,0.05)",border:"1px solid #f5eaf0"}}>
        <div style={{background:"#f0e0ea",borderRadius:"7px",padding:"4px 7px",minWidth:"44px",textAlign:"center"}}>
          <div style={{fontSize:"0.76rem",fontWeight:800,color:"#c9527a"}}>{cita.hora}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,color:"#3a1a2e",fontSize:"0.86rem",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cl?.nombre||"?"}</div>
          <div style={{fontSize:"0.72rem",color:"#9a6a8a"}}>{cita.empleada}</div>
        </div>
        {badge&&<span style={{fontSize:"0.67rem",background:"#fff3cd",color:"#856404",borderRadius:"5px",padding:"2px 6px",fontWeight:700,flexShrink:0}}>{badge}</span>}
        {cl?.telefono
          ?<button onClick={()=>enviarWa(cita,cuando)} style={{...btn("#25D366"),padding:"5px 11px",fontSize:"0.74rem",flexShrink:0}}>💬 WA</button>
          :<span style={{fontSize:"0.7rem",color:"#ccc",flexShrink:0}}>Sin tel.</span>
        }
      </div>
    );
  };

  return(
    <div>
      {/* Aviso explicativo */}
      <div style={{background:"#e8f5e9",border:"1px solid #a5d6a7",borderRadius:"9px",padding:"11px 15px",marginBottom:"20px",fontSize:"0.83rem",color:"#2e7d32",lineHeight:1.6}}>
        <strong>💬 Cómo funciona:</strong> WhatsApp no permite envíos automáticos desde webs externas sin una API de pago.
        Lo que puedes hacer aquí es pulsar <strong>"Enviar todos"</strong> y se abrirán los chats uno a uno con el mensaje ya escrito — solo tienes que pulsar Enviar en cada uno.
        Tarda menos de 1 minuto para 10 citas.
      </div>

      {/* Próximas hoy (2-3h) */}
      {proximasDos.length>0&&(
        <div style={{background:"#fff8e1",border:"1px solid #ffe082",borderRadius:"9px",padding:"12px 15px",marginBottom:"20px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
            <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.05rem",color:"#7a5a00"}}>⚡ Próximas en 2-3 horas ({proximasDos.length})</h3>
            <button onClick={()=>enviarTodos(proximasDos,"en un momento")} style={{...btn("#f0a000","#fff"),padding:"5px 12px",fontSize:"0.76rem"}}>📤 Enviar todos</button>
          </div>
          {proximasDos.map(c=><Card key={c.id} cita={c} cuando="en un momento" badge="¡Pronto!"/>)}
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"20px"}}>
        {/* Hoy */}
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"11px"}}>
            <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.1rem",color:"#3a1a2e"}}>📅 Hoy · {fmt(today())} <span style={{fontSize:"0.83rem",color:"#9a6a8a"}}>({hoy.length})</span></h3>
            {hoy.length>0&&<button onClick={()=>enviarTodos(hoy,"hoy")} style={{...btn("#25D366"),padding:"4px 10px",fontSize:"0.74rem"}}>📤 Enviar todos</button>}
          </div>
          {hoy.length===0
            ?<p style={{color:"#ccc",fontSize:"0.84rem"}}>Sin citas pendientes hoy</p>
            :hoy.map(c=><Card key={c.id} cita={c} cuando="hoy"/>)
          }
        </div>

        {/* Mañana */}
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"11px"}}>
            <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.1rem",color:"#3a1a2e"}}>🔔 Mañana · {fmt(manStr)} <span style={{fontSize:"0.83rem",color:"#9a6a8a"}}>({man.length})</span></h3>
            {man.length>0&&<button onClick={()=>enviarTodos(man,"mañana")} style={{...btn("#25D366"),padding:"4px 10px",fontSize:"0.74rem"}}>📤 Enviar todos</button>}
          </div>
          {man.length===0
            ?<p style={{color:"#ccc",fontSize:"0.84rem"}}>Sin citas mañana</p>
            :man.map(c=><Card key={c.id} cita={c} cuando="mañana"/>)
          }
        </div>
      </div>

      {/* Otro día */}
      {(()=>{
        const citasOtro=otroDia?citas.filter(c=>c.fecha===otroDia&&!c.cobrado).sort((a,b)=>a.hora.localeCompare(b.hora)):[];
        const cuandoTexto=otroDia?`el ${fmt(otroDia)}`:"ese día";
        return(
          <div style={{marginTop:"24px",background:"white",borderRadius:"12px",padding:"18px",boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
              <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.1rem",color:"#3a1a2e"}}>📆 Otro día</h3>
              <input type="date" value={otroDia} onChange={e=>setOtroDia(e.target.value)} style={{...inp,width:"160px"}}/>
              {otroDia&&citasOtro.length>0&&<button onClick={()=>enviarTodos(citasOtro,cuandoTexto)} style={{...btn("#25D366"),padding:"4px 10px",fontSize:"0.74rem"}}>📤 Enviar todos ({citasOtro.length})</button>}
            </div>
            {!otroDia&&<p style={{color:"#ccc",fontSize:"0.84rem"}}>Selecciona una fecha para ver sus citas y enviar recordatorios</p>}
            {otroDia&&citasOtro.length===0&&<p style={{color:"#ccc",fontSize:"0.84rem"}}>Sin citas ese día</p>}
            {otroDia&&citasOtro.map(c=><Card key={c.id} cita={c} cuando={cuandoTexto}/>)}
          </div>
        );
      })()}

      {/* Modal cola de envío — evita bloqueo de popups del navegador */}
      {colaEnvio&&(
      <Modal title={`💬 Enviar recordatorios — ${colaEnvio.cuando}`} onClose={()=>{setColaEnvio(null);setEnviados(new Set());}}>
        <div style={{background:"#e8f5e9",borderRadius:"9px",padding:"10px 14px",marginBottom:"14px",fontSize:"0.82rem",color:"#2e7d32",lineHeight:1.6}}>
          Haz clic en <strong>Abrir WA</strong> de cada clienta. El mensaje ya está escrito — solo pulsa <strong>Enviar</strong> en WhatsApp.
        </div>
        <div style={{fontSize:"0.83rem",fontWeight:700,color:"#9a6a8a",marginBottom:"12px"}}>
          {enviados.size} de {colaEnvio.lista.length} enviados
        </div>
        {colaEnvio.lista.map(cita=>{
          const cl=clientes.find(c=>c.id===cita.clienteId);
          const hecho=enviados.has(cita.id);
          return(
            <div key={cita.id} style={{display:"flex",alignItems:"center",gap:"10px",padding:"9px 12px",background:hecho?"#f0fff4":"white",borderRadius:"9px",marginBottom:"6px",border:`1px solid ${hecho?"#a5d6a7":"#f5eaf0"}`,transition:"background 0.2s"}}>
              <div style={{background:"#f0e0ea",borderRadius:"7px",padding:"4px 8px",fontSize:"0.76rem",fontWeight:800,color:"#c9527a",minWidth:"46px",textAlign:"center"}}>{cita.hora}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,color:"#3a1a2e",fontSize:"0.86rem"}}>{cl?.nombre||"?"}</div>
                <div style={{fontSize:"0.72rem",color:"#9a6a8a"}}>{cl?.telefono||"Sin teléfono"}</div>
              </div>
              {hecho
                ?<span style={{color:"#2a7a4a",fontWeight:700,fontSize:"0.82rem",whiteSpace:"nowrap"}}>✅ Abierto</span>
                :<button onClick={()=>{enviarWa(cita,colaEnvio.cuando);setEnviados(prev=>new Set([...prev,cita.id]));}} style={{...btn("#25D366"),padding:"6px 14px",fontSize:"0.8rem",whiteSpace:"nowrap"}}>💬 Abrir WA</button>
              }
            </div>
          );
        })}
        <div style={{marginTop:"16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:"0.78rem",color:"#aaa"}}>
            {enviados.size===colaEnvio.lista.length&&colaEnvio.lista.length>0?"🎉 ¡Todos enviados!":""}
          </span>
          <button onClick={()=>{setColaEnvio(null);setEnviados(new Set());}} style={btn("#c9527a")}>Cerrar</button>
        </div>
      </Modal>
    )}
    </div>
  );
}

// ─── CONFIGURACIÓN ───────────────────────────────────────────────────────────
function Configuracion({config,onSave,usuario,onChangePass,personal,onSavePersonal,onBackup,onRestore}){
  const [form,setForm]=useState({...config});
  const [passForm,setPassForm]=useState({vieja:"",nueva:"",rep:""});
  const [passMsg,setPassMsg]=useState("");
  const [staffForm,setStaffForm]=useState(null); // null=lista, obj=edit
  const restoreRef=useRef();
  const esAdmin=usuario.rol==="admin";

  function cambiarPass(){
    const encontrado=personal.find(x=>x.id===usuario.id)||USERS.find(x=>x.id===usuario.id);
    const passActual=encontrado?.pass||"";
    if(passActual!==passForm.vieja){setPassMsg("❌ Contraseña actual incorrecta");return;}
    if(passForm.nueva.length<6){setPassMsg("❌ La nueva contraseña debe tener al menos 6 caracteres");return;}
    if(passForm.nueva!==passForm.rep){setPassMsg("❌ Las contraseñas no coinciden");return;}
    onChangePass(usuario.id,passForm.nueva);
    setPassMsg("✅ Contraseña cambiada correctamente");
    setPassForm({vieja:"",nueva:"",rep:""});
  }

  function guardarPersonal(){
    if(!staffForm||!staffForm.nombre||!staffForm.id) return;
    const existe=personal.find(p=>p.id===staffForm.id);
    const nueva=existe?personal.map(p=>p.id===staffForm.id?staffForm:p):[...personal,staffForm];
    onSavePersonal(nueva);
    setStaffForm(null);
  }

  function handleRestore(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.__backup) return alert("❌ Archivo de backup no válido.");
        if(window.confirm("⚠️ Esto reemplazará TODOS los datos actuales. ¿Continuar?")){
          onRestore(data);
          alert("✅ Backup restaurado correctamente. Recarga la página.");
        }
      }catch(e){alert("❌ Error leyendo el archivo de backup.");}
    };
    reader.readAsText(file,"UTF-8");
    e.target.value="";
  }

  const ROLES_OPCIONES=["admin","empleada","restringido"];
  const COLORES_OPCIONES=["#c9527a","#7a9ec9","#b07ad6","#c9a052","#7abf7a","#c97a52","#529ac9","#9ac952"];

  return(
    <div style={{maxWidth:"640px"}}>
      {/* Datos del centro */}
      <div style={{background:"white",borderRadius:"13px",padding:"22px",boxShadow:"0 2px 12px rgba(0,0,0,0.05)",marginBottom:"14px"}}>
        <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.15rem",color:"#3a1a2e",marginBottom:"16px"}}>Datos del Centro</h3>
        <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
          <Field label="Nombre del centro"><input value={form.nombreEmpresa||""} onChange={e=>setForm({...form,nombreEmpresa:e.target.value})} style={inp} placeholder="Star Wappas"/></Field>
          <Field label="NIF" half><input value={form.nif||""} onChange={e=>setForm({...form,nif:e.target.value})} style={inp}/></Field>
          <Field label="Teléfono" half><input value={form.telefono||""} onChange={e=>setForm({...form,telefono:e.target.value})} style={inp}/></Field>
          <Field label="Dirección"><input value={form.direccion||""} onChange={e=>setForm({...form,direccion:e.target.value})} style={inp}/></Field>
          <Field label="Email" half><input type="email" value={form.email||""} onChange={e=>setForm({...form,email:e.target.value})} style={inp}/></Field>
          <Field label="Web" half><input value={form.web||""} onChange={e=>setForm({...form,web:e.target.value})} style={inp}/></Field>
          <Field label="URL del logo"><input value={form.logoUrl||""} onChange={e=>setForm({...form,logoUrl:e.target.value})} style={inp} placeholder="https://..."/></Field>
        </div>
        <button onClick={()=>onSave(form)} style={btn()}>💾 Guardar</button>
      </div>

      {/* Cambiar contraseña */}
      <div style={{background:"white",borderRadius:"13px",padding:"22px",boxShadow:"0 2px 12px rgba(0,0,0,0.05)",marginBottom:"14px"}}>
        <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.15rem",color:"#3a1a2e",marginBottom:"16px"}}>🔑 Cambiar mi contraseña</h3>
        <div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>
          <Field label="Contraseña actual"><input type="password" value={passForm.vieja} onChange={e=>setPassForm({...passForm,vieja:e.target.value})} style={inp}/></Field>
          <Field label="Nueva contraseña" half><input type="password" value={passForm.nueva} onChange={e=>setPassForm({...passForm,nueva:e.target.value})} style={inp}/></Field>
          <Field label="Repetir nueva" half><input type="password" value={passForm.rep} onChange={e=>setPassForm({...passForm,rep:e.target.value})} style={inp}/></Field>
        </div>
        {passMsg&&<div style={{background:passMsg.startsWith("✅")?"#d4f0e0":"#ffe0e0",borderRadius:"7px",padding:"9px 12px",fontSize:"0.83rem",color:passMsg.startsWith("✅")?"#2a7a4a":"#c03030",marginBottom:"10px"}}>{passMsg}</div>}
        <button onClick={cambiarPass} style={btn("#7a4a8a")}>🔑 Cambiar contraseña</button>
      </div>

      {/* Gestión de personal (solo admin) */}
      {esAdmin&&(
        <div style={{background:"white",borderRadius:"13px",padding:"22px",boxShadow:"0 2px 12px rgba(0,0,0,0.05)",marginBottom:"14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
            <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.15rem",color:"#3a1a2e"}}>👤 Gestión de Personal</h3>
            <button onClick={()=>setStaffForm({id:uid(),nombre:"",loginId:"",pass:"",rol:"empleada",color:COLORES_OPCIONES[personal.length%COLORES_OPCIONES.length]})} style={{...btn(),padding:"5px 12px",fontSize:"0.78rem"}}>+ Añadir</button>
          </div>
          <div style={{marginBottom:staffForm?"12px":"0"}}>
            {personal.map(p=>(
              <div key={p.id} style={{display:"flex",alignItems:"center",gap:"8px",padding:"8px 10px",borderRadius:"8px",border:"1px solid #f0e0ea",marginBottom:"6px",background:"#fdf8fb"}}>
                <div style={{width:"20px",height:"20px",borderRadius:"50%",background:p.color||"#c9527a",flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,color:"#3a1a2e",fontSize:"0.87rem"}}>{p.nombre}</div>
                  <div style={{fontSize:"0.72rem",color:"#9a6a8a"}}>@{p.loginId} · {p.rol}</div>
                </div>
                <button onClick={()=>setStaffForm({...p})} style={{...btn("#f0e0ea","#3a1a2e"),padding:"3px 9px",fontSize:"0.73rem"}}>✏️</button>
                <button onClick={()=>{if(p.id===usuario.id)return alert("No puedes eliminarte a ti mismo.");if(window.confirm(`¿Eliminar a ${p.nombre}?`))onSavePersonal(personal.filter(x=>x.id!==p.id));}} style={{...btn("#fde8e8","#c03030"),padding:"3px 9px",fontSize:"0.73rem"}}>🗑</button>
              </div>
            ))}
            {personal.length===0&&<p style={{color:"#ccc",fontSize:"0.83rem"}}>Sin personal registrado. El sistema usará los usuarios base.</p>}
          </div>
          {staffForm&&(
            <div style={{background:"#fdf0f5",borderRadius:"10px",padding:"14px",marginTop:"10px"}}>
              <div style={{fontWeight:700,color:"#9a6a8a",fontSize:"0.76rem",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"10px"}}>{staffForm.nombre?"Editar":"Nuevo"} trabajador/a</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
                <Field label="Nombre" half><input value={staffForm.nombre||""} onChange={e=>setStaffForm({...staffForm,nombre:e.target.value})} style={inp}/></Field>
                <Field label="Login (sin espacios)" half><input value={staffForm.loginId||""} onChange={e=>setStaffForm({...staffForm,loginId:e.target.value.toLowerCase().replace(/\s/g,"")})} style={inp} placeholder="antonia"/></Field>
                <Field label="Contraseña" half><input type="text" value={staffForm.pass||""} onChange={e=>setStaffForm({...staffForm,pass:e.target.value})} style={inp}/></Field>
                <Field label="Rol" half>
                  <select value={staffForm.rol||"empleada"} onChange={e=>setStaffForm({...staffForm,rol:e.target.value})} style={inp}>
                    {ROLES_OPCIONES.map(r=><option key={r}>{r}</option>)}
                  </select>
                </Field>
                <Field label="Color">
                  <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                    {COLORES_OPCIONES.map(c=>(
                      <div key={c} onClick={()=>setStaffForm({...staffForm,color:c})} style={{width:"26px",height:"26px",borderRadius:"50%",background:c,cursor:"pointer",border:staffForm.color===c?"3px solid #3a1a2e":"2px solid transparent"}}/>
                    ))}
                  </div>
                </Field>
              </div>
              <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"10px"}}>
                <button onClick={()=>setStaffForm(null)} style={btn("#f0e0ea","#3a1a2e")}>Cancelar</button>
                <button onClick={guardarPersonal} style={btn()}>💾 Guardar</button>
              </div>
            </div>
          )}
          <div style={{fontSize:"0.78rem",color:"#bbb",marginTop:"10px",lineHeight:1.5}}>
            ℹ️ Los cambios de personal se aplican en el próximo inicio de sesión.
          </div>
        </div>
      )}

      {/* Backup / Restore */}
      {esAdmin&&(
        <div style={{background:"white",borderRadius:"13px",padding:"22px",boxShadow:"0 2px 12px rgba(0,0,0,0.05)",marginBottom:"14px"}}>
          <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.15rem",color:"#3a1a2e",marginBottom:"12px"}}>💾 Copia de seguridad</h3>
          <div style={{fontSize:"0.83rem",color:"#555",marginBottom:"14px",lineHeight:1.6}}>
            Descarga todos los datos del sistema como archivo JSON. Guárdalo en un lugar seguro (Dropbox, Drive…). En caso de pérdida de datos, puedes restaurarlo aquí.
          </div>
          <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
            <button onClick={onBackup} style={btn("#2a7a4a")}>⬇️ Descargar backup</button>
            <button onClick={()=>restoreRef.current.click()} style={btn("#9a6a2a")}>⬆️ Restaurar backup</button>
            <input ref={restoreRef} type="file" accept=".json" onChange={handleRestore} style={{display:"none"}}/>
          </div>
        </div>
      )}

      {/* Verifactú */}
      <div style={{background:"white",borderRadius:"13px",padding:"22px",boxShadow:"0 2px 12px rgba(0,0,0,0.05)"}}>
        <h3 style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.15rem",color:"#3a1a2e",marginBottom:"10px"}}>📋 Verifactú 2027</h3>
        <div style={{fontSize:"0.84rem",lineHeight:1.7,color:"#555"}}>
          Este programa ya guarda toda la información necesaria: facturas con número correlativo, NIF del emisor y receptor, desglose de IVA, fecha y método de pago. Cuando llegue el momento, Kabilio u otro software certificado podrá conectarse y generar los registros XML para la AEAT.
        </div>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
const ALL_TABS=[
  {id:"agenda",ico:"🗓️",label:"Agenda",roles:["admin","empleada","restringido"]},
  {id:"clientes",ico:"👥",label:"Clientes",roles:["admin","empleada"]},
  {id:"tarifas",ico:"💅",label:"Tarifas",roles:["admin"]},
  {id:"tickets",ico:"🧾",label:"Tickets",roles:["admin"]},
  {id:"caja",ico:"💰",label:"Caja",roles:["admin"]},
  {id:"bonos",ico:"🎟️",label:"Bonos",roles:["admin","empleada"]},
  {id:"tarjetas",ico:"🎁",label:"Tarjetas",roles:["admin"]},
  {id:"stock",ico:"📦",label:"Stock",roles:["admin"]},
  {id:"stats",ico:"📊",label:"Informes",roles:["admin"]},
  {id:"recordatorios",ico:"🔔",label:"Recordatorios",roles:["admin","empleada"]},
  {id:"config",ico:"⚙️",label:"Config",roles:["admin","empleada","restringido"]},
];

function App(){
  const [usuario,setUsuario]=useState(()=>{try{const u=localStorage.getItem("sw_usuario");return u?JSON.parse(u):null;}catch(e){return null;}});
  const [tab,setTab]=useState(()=>{try{return localStorage.getItem("sw_tab")||"agenda";}catch(e){return "agenda";}});
  const [citas,setCitas]=useState([]);
  const [clientes,setClientes]=useState([]);
  const [ingresos,setIngresos]=useState([]);
  const [gastos,setGastos]=useState([]);
  const [productos,setProductos]=useState([]);
  const [bonos,setBonos]=useState([]);
  const [ventas,setVentas]=useState([]);
  const [servicios,setServicios]=useState([]);
  const [tarjetas,setTarjetas]=useState([]);
  const [personal,setPersonal]=useState([]);
  const [config,setConfig]=useState({nombreEmpresa:"",nif:"",telefono:"",direccion:"",email:"",web:"",logoUrl:""});
  const [passes,setPasses]=useState({});
  const [loaded,setLoaded]=useState(false);
  const [saved,setSaved]=useState(false);

  useEffect(()=>{
    (async()=>{
      setCitas(await load("v3_citas",[]));
      setClientes(await load("v3_clientes",[]));
      setIngresos(await load("v3_ingresos",[]));
      setGastos(await load("v3_gastos",[]));
      setProductos(await load("v3_productos",[]));
      setBonos(await load("v3_bonos",[]));
      setVentas(await load("v3_ventas",[]));
      setServicios(await load("v3_servicios",[]));
      setTarjetas(await load("v3_tarjetas",[]));
      setPersonal(await load("v3_personal",[]));
      setConfig(await load("v3_config",{nombreEmpresa:"",nif:"",telefono:"",direccion:"",email:"",web:"",logoUrl:""}));
      setPasses(await load("v3_passes",{}));
      setLoaded(true);
    })();
  },[]);

  const as=(key,val,setter)=>{setter(val);save(key,val);setSaved(true);setTimeout(()=>setSaved(false),1500);};
  function cambiarTab(t){setTab(t);try{localStorage.setItem("sw_tab",t);}catch(e){}}
  function hacerLogin(u){setUsuario(u);try{localStorage.setItem("sw_usuario",JSON.stringify(u));}catch(e){}}
  function hacerLogout(){setUsuario(null);try{localStorage.removeItem("sw_usuario");localStorage.removeItem("sw_tab");}catch(e){}}

  function handleChangePass(userId,newPass){
    // Cambiar en personal si existe, si no en passes
    if(personal.find(p=>p.id===userId)){
      const np=personal.map(p=>p.id===userId?{...p,pass:newPass}:p);
      setPersonal(np);save("v3_personal",np);
    } else {
      const np={...passes,[userId]:newPass};
      setPasses(np); save("v3_passes",np);
    }
  }

  function getPass(userId){
    const p=personal.find(x=>x.id===userId);
    if(p) return p.pass||"";
    return passes[userId]||USERS.find(u=>u.id===userId)?.pass||"";
  }

  function handleBackup(){
    const data={
      __backup:true,__version:"v3",__fecha:today(),
      v3_citas:citas,v3_clientes:clientes,v3_ingresos:ingresos,v3_gastos:gastos,
      v3_productos:productos,v3_bonos:bonos,v3_ventas:ventas,v3_servicios:servicios,
      v3_tarjetas:tarjetas,v3_personal:personal,v3_config:config,v3_passes:passes,
    };
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
    a.download=`starwappas_backup_${today()}.json`;a.click();
  }

  function handleRestore(data){
    if(data.v3_citas!==undefined){setCitas(data.v3_citas);save("v3_citas",data.v3_citas);}
    if(data.v3_clientes!==undefined){setClientes(data.v3_clientes);save("v3_clientes",data.v3_clientes);}
    if(data.v3_ingresos!==undefined){setIngresos(data.v3_ingresos);save("v3_ingresos",data.v3_ingresos);}
    if(data.v3_gastos!==undefined){setGastos(data.v3_gastos);save("v3_gastos",data.v3_gastos);}
    if(data.v3_productos!==undefined){setProductos(data.v3_productos);save("v3_productos",data.v3_productos);}
    if(data.v3_bonos!==undefined){setBonos(data.v3_bonos);save("v3_bonos",data.v3_bonos);}
    if(data.v3_ventas!==undefined){setVentas(data.v3_ventas);save("v3_ventas",data.v3_ventas);}
    if(data.v3_servicios!==undefined){setServicios(data.v3_servicios);save("v3_servicios",data.v3_servicios);}
    if(data.v3_tarjetas!==undefined){setTarjetas(data.v3_tarjetas);save("v3_tarjetas",data.v3_tarjetas);}
    if(data.v3_personal!==undefined){setPersonal(data.v3_personal);save("v3_personal",data.v3_personal);}
    if(data.v3_config!==undefined){setConfig(data.v3_config);save("v3_config",data.v3_config);}
    if(data.v3_passes!==undefined){setPasses(data.v3_passes);save("v3_passes",data.v3_passes);}
  }

  // Lista de usuarios efectivos: personal de localStorage tiene prioridad
  const usuariosEfectivos=personal.length>0?personal:USERS;

  if(!loaded) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"Cormorant Garamond,serif",fontSize:"1.4rem",color:"#c9527a"}}>Cargando tu centro… ✨</div>;

  if(!usuario) return <Login usuarios={usuariosEfectivos} passes={passes} onLogin={(u)=>{hacerLogin(u);cambiarTab("agenda");}}/>;

  const TABS=ALL_TABS.filter(t=>t.roles.includes(usuario.rol));
  if(!TABS.find(t=>t.id===tab)) setTab(TABS[0]?.id||"agenda");

  const citasHoy=citas.filter(c=>c.fecha===today()).length;
  const stockBajo=productos.filter(p=>Number(p.stock||0)<=Number(p.stockMin||0)).length;
  const pendCobro=citas.filter(c=>!c.cobrado&&c.fecha===today()).length;
  const tarjActivas=tarjetas.filter(t=>t.activa&&Number(t.saldo||0)>0).length;

  return(
    <div style={{minHeight:"100vh",background:"#faf5f8"}}>
      {/* Header */}
