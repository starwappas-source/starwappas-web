      <div style={{background:"linear-gradient(135deg,#3a1a2e 0%,#5c2a44 100%)",padding:"13px 20px",display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap"}}>
        <div>
          <div style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.35rem",color:"white",fontWeight:600}}>{config.nombreEmpresa||"⭐ Star Wappas"}</div>
          <div style={{fontSize:"0.68rem",color:"rgba(255,255,255,0.4)",marginTop:"1px"}}>Hola, <strong style={{color:"rgba(255,255,255,0.7)"}}>{usuario.nombre}</strong> · {usuario.rol==="admin"?"Administradora":usuario.rol==="empleada"?"Empleada":"Acceso restringido"}</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:"7px",flexWrap:"wrap",alignItems:"center"}}>
          {saved&&<span style={{background:"rgba(255,255,255,0.13)",color:"#a0ffb0",borderRadius:"20px",padding:"3px 10px",fontSize:"0.7rem"}}>✓ Guardado</span>}
          {citasHoy>0&&<span style={{background:"rgba(255,255,255,0.11)",color:"white",borderRadius:"20px",padding:"3px 10px",fontSize:"0.7rem"}}>🗓️ {citasHoy} hoy</span>}
          {usuario.rol==="admin"&&pendCobro>0&&<span style={{background:"#f0c060",color:"#3a2000",borderRadius:"20px",padding:"3px 10px",fontSize:"0.7rem"}}>💳 {pendCobro} por cobrar</span>}
          {usuario.rol==="admin"&&stockBajo>0&&<span style={{background:"#f08040",color:"white",borderRadius:"20px",padding:"3px 10px",fontSize:"0.7rem"}}>📦 Stock bajo</span>}
          {usuario.rol==="admin"&&tarjActivas>0&&<span style={{background:"#d060f0",color:"white",borderRadius:"20px",padding:"3px 10px",fontSize:"0.7rem"}}>🎁 {tarjActivas} activas</span>}
          <button onClick={hacerLogout} style={{...btn("#ffffff22","rgba(255,255,255,0.7)"),padding:"5px 12px",fontSize:"0.75rem",borderRadius:"20px"}}>Salir →</button>
        </div>
      </div>

      {/* Nav */}
      <div style={{background:"white",borderBottom:"1px solid #f0e0ea",display:"flex",overflowX:"auto",padding:"0 10px"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>cambiarTab(t.id)} style={{background:"none",border:"none",padding:"12px 12px",cursor:"pointer",fontSize:"0.79rem",fontWeight:600,color:tab===t.id?"#c9527a":"#9a8090",borderBottom:tab===t.id?"2.5px solid #c9527a":"2.5px solid transparent",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:"4px",fontFamily:"inherit"}}>
            <span>{t.ico}</span><span>{t.label}</span>
            {t.id==="clientes"&&clientes.length>0&&<span style={{background:"#f0e0ea",color:"#c9527a",borderRadius:"9px",padding:"1px 5px",fontSize:"0.65rem",fontWeight:700}}>{clientes.length}</span>}
            {t.id==="tarjetas"&&tarjActivas>0&&<span style={{background:"#f0e0ea",color:"#c9527a",borderRadius:"9px",padding:"1px 5px",fontSize:"0.65rem",fontWeight:700}}>{tarjActivas}</span>}
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{padding:"18px 16px",maxWidth:"1320px",margin:"0 auto"}}>
        {tab==="agenda"&&<Agenda citas={citas} clientes={clientes} servicios={servicios} bonos={bonos} usuario={usuario} onAdd={c=>as("v3_citas",[...citas,c],setCitas)} onEdit={c=>as("v3_citas",citas.map(x=>x.id===c.id?c:x),setCitas)} onDelete={id=>as("v3_citas",citas.filter(x=>x.id!==id),setCitas)} onAddCliente={c=>as("v3_clientes",[...clientes,c],setClientes)} onEditBono={b=>as("v3_bonos",bonos.map(x=>x.id===b.id?b:x),setBonos)} onAddIngreso={i=>as("v3_ingresos",[...ingresos,i],setIngresos)}/>}
        {tab==="clientes"&&<Clientes clientes={clientes} citas={citas} servicios={servicios} bonos={bonos} onAdd={c=>as("v3_clientes",[...clientes,c],setClientes)} onBulkAdd={arr=>as("v3_clientes",[...clientes,...arr],setClientes)} onEdit={c=>as("v3_clientes",clientes.map(x=>x.id===c.id?c:x),setClientes)} onDelete={id=>as("v3_clientes",clientes.filter(x=>x.id!==id),setClientes)}/>}
        {tab==="tarifas"&&<Tarifas servicios={servicios} onAdd={s=>as("v3_servicios",[...servicios,s],setServicios)} onEdit={s=>as("v3_servicios",servicios.map(x=>x.id===s.id?s:x),setServicios)} onDelete={id=>as("v3_servicios",servicios.filter(x=>x.id!==id),setServicios)}/>}
        {tab==="tickets"&&<Tickets citas={citas} clientes={clientes} servicios={servicios} config={config} onCancelarTicket={id=>as("v3_citas",citas.map(c=>c.id===id?{...c,cobrado:false,terminado:false}:c),setCitas)}/>}
        {tab==="caja"&&<Caja ingresos={ingresos} gastos={gastos} clientes={clientes} onAddIngreso={i=>as("v3_ingresos",[...ingresos,i],setIngresos)} onDeleteIngreso={id=>as("v3_ingresos",ingresos.filter(x=>x.id!==id),setIngresos)} onAddGasto={g=>as("v3_gastos",[...gastos,g],setGastos)} onDeleteGasto={id=>as("v3_gastos",gastos.filter(x=>x.id!==id),setGastos)}/>}
        {tab==="bonos"&&<Bonos bonos={bonos} clientes={clientes} servicios={servicios} onAdd={b=>as("v3_bonos",[...bonos,b],setBonos)} onEdit={b=>as("v3_bonos",bonos.map(x=>x.id===b.id?b:x),setBonos)} onDelete={id=>as("v3_bonos",bonos.filter(x=>x.id!==id),setBonos)} onAddCliente={c=>as("v3_clientes",[...clientes,c],setClientes)} onAddIngreso={i=>as("v3_ingresos",[...ingresos,i],setIngresos)}/>}
        {tab==="tarjetas"&&<TarjetasRegalo tarjetas={tarjetas} clientes={clientes} onAdd={t=>as("v3_tarjetas",[...tarjetas,t],setTarjetas)} onEdit={t=>as("v3_tarjetas",tarjetas.map(x=>x.id===t.id?t:x),setTarjetas)} onDelete={id=>as("v3_tarjetas",tarjetas.filter(x=>x.id!==id),setTarjetas)}/>}
        {tab==="stock"&&<Stock productos={productos} ventas={ventas} onAdd={p=>as("v3_productos",[...productos,p],setProductos)} onEdit={p=>as("v3_productos",productos.map(x=>x.id===p.id?p:x),setProductos)} onDelete={id=>as("v3_productos",productos.filter(x=>x.id!==id),setProductos)} onAddVenta={v=>as("v3_ventas",[...ventas,v],setVentas)}/>}
        {tab==="stats"&&<Estadisticas citas={citas} ingresos={ingresos} gastos={gastos} clientes={clientes} servicios={servicios}/>}
        {tab==="recordatorios"&&<Recordatorios citas={citas} clientes={clientes} config={config}/>}
        {tab==="config"&&<Configuracion config={config} usuario={usuario} personal={personal}
          onSave={c=>{setConfig(c);save("v3_config",c);setSaved(true);setTimeout(()=>setSaved(false),1500);}}
          onChangePass={handleChangePass}
          onSavePersonal={p=>as("v3_personal",p,setPersonal)}
          onBackup={handleBackup}
          onRestore={handleRestore}
        />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
